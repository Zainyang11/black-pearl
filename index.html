<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="config.js"></script>
<script>
// Standalone build: outside Claude there is no window.claude, so the game's
// sample() goes through a small proxy (see worker.js) that holds the API key.
(() => {
  if (window.claude) return;
  const PROXY = (window.BP_PROXY || "").replace(/\/$/, "");
  const MODEL = { quick: "claude-haiku-5-5", default: "claude-sonnet-5-5" };
  const fail = (code, msg) => Object.assign(new Error(msg || code), { code });

  async function sample(prompt, opts = {}) {
    const messages = typeof prompt === "string" ? [{ role: "user", content: prompt }] : prompt;
    let res;
    try {
      res = await fetch(PROXY + "/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json" },
        signal: opts.signal,
        body: JSON.stringify({
          model: opts.modelTier === "quick" ? MODEL.quick : MODEL.default,
          max_tokens: 4096,
          stream: true,
          messages,
        }),
      });
    } catch (e) {
      if (e.name === "AbortError") throw e;
      throw fail("network", "连不上 AI 服务");
    }
    if (res.status === 429) throw fail("rate_limited");
    if (!res.ok) throw fail("upstream", "AI 服务出错 " + res.status);

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
        if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") {
          text += ev.delta.text;
          opts.onText?.({ text });
        } else if (ev.type === "error") {
          throw fail(ev.error?.type === "rate_limit_error" ? "rate_limited" : "upstream", ev.error?.message);
        }
      }
    }
    return { text };
  }

  window.claude = { use: async (name) => (name === "sample" && PROXY ? sample : null) };
})();
</script>
<title>黑珍珠海域</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;500;600&family=Cinzel:wght@600;800&display=swap">
<style>
/* Layout: two modes like Craft — PLAY (full-bleed art, story cards in a centered column, top HUD, right icon rail with a docked side panel)
   and WORKSPACE (top bar, left place rail, center place view, right AI assistant). Committed dark theme. */
:root{
  --bg:#0e0e10; --panel:#151517; --panel-2:#1b1b1e; --card:rgba(20,20,22,.82); --card-solid:#18181b;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --ink:#ecebe8; --ink-2:#b4b2ad; --mute:#7e7c78;
  --accent:#6d63f5; --accent-2:#8b80ff; --folder:#8f86ff; --gold:#d9b46a; --red:#d95b52; --green:#57c06a; --amber:#e3a33b; --sea:#64b5cc;
  --f-ui:"Outfit","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-story:"Noto Serif SC","Songti SC",Georgia,serif;
  --f-deco:"Cinzel","Noto Serif SC",serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}::-webkit-scrollbar-track{background:transparent}
.ent{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:3px;cursor:pointer}
.ent:hover{text-decoration-color:var(--accent-2)}
.mono{font-family:var(--f-mono)}

/* ================= PLAY ================= */
#play{position:fixed;inset:0;display:flex;padding-top:env(safe-area-inset-top,0px)}
.stage{position:relative;flex:1;min-width:0;overflow:hidden}
.art{position:absolute;inset:-30px;background:#0e0e10 center/cover no-repeat;filter:saturate(.9);transition:background-image .8s,filter .6s}
.stage.chat .art{filter:blur(14px) saturate(.75) brightness(.8)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.5),rgba(10,10,12,.68) 40%,rgba(10,10,12,.88))}
.stage.reading .art::after{background:rgba(10,10,12,.86)}
.hud-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(18,18,20,.7);border:1px solid var(--line);color:var(--ink);backdrop-filter:blur(8px)}
.hud-btn:hover{background:rgba(30,30,34,.9)}
#menuBtn{position:absolute;z-index:6;top:12px;left:max(12px,env(safe-area-inset-left,0px))}
.menu{position:absolute;z-index:30;top:52px;left:max(12px,env(safe-area-inset-left,0px));width:220px;background:#1a1a1d;border:1px solid var(--line-2);border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left}
.menu button:hover{background:rgba(255,255,255,.06)}
.menu button kbd{margin-left:auto;font-family:var(--f-ui);font-size:11px;color:var(--mute)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.ach{position:absolute;z-index:6;top:12px;left:50%;transform:translateX(-50%);text-align:center}
.ach-pill{display:block;padding:4px 14px;border-radius:999px;background:rgba(18,18,20,.72);border:1px solid var(--line);backdrop-filter:blur(8px)}
.ach-pill small{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--ink-2)}
.ach-pill b{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.ach .dots{display:flex;gap:4px;justify-content:center;margin-top:5px}
.ach .dots i{width:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.ach .dots i.on{width:12px;background:#fff}
.ach-pop{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:min(380px,calc(100vw - 32px));background:#1a1a1d;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.ach-pop .hd{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.trk{margin-bottom:9px;font-size:12.5px}
.trk .r{display:flex;justify-content:space-between}
.trk .r b{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--ink-2)}
.trk .t{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:4px;overflow:hidden}
.trk .t i{display:block;height:100%;background:var(--ink-2)}
.minimap{position:absolute;z-index:6;top:12px;right:62px;width:178px;height:106px;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);background:#0b1418 center/cover;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.minimap img{width:100%;height:100%;object-fit:cover;display:block}
.minimap .lbl{position:absolute;right:6px;bottom:6px;font-size:10.5px;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:4px}
.pin{position:absolute;transform:translate(-50%,-50%)}
.pin i{display:block;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.pin.you i{width:16px;height:16px;border:2px solid #fff;background:var(--accent) center/cover;box-shadow:0 0 0 3px rgba(109,99,245,.35)}
.rail-r{position:absolute;z-index:6;top:12px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;padding:4px;border-radius:22px;background:rgba(18,18,20,.72);border:1px solid var(--line);backdrop-filter:blur(8px)}
.rail-r button{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.rail-r button:hover,.rail-r button[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.1)}
.rail-r .av{width:24px;height:24px;border-radius:50%;overflow:hidden;background:#333;display:grid;place-items:center;font-size:11px;color:var(--gold);border:1px solid var(--line-2)}
.rail-r .badge{position:absolute;top:-2px;right:-3px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 3px}
.story{position:absolute;inset:0;z-index:2;overflow-y:auto;padding:70px 64px 200px}
.story-in{width:min(640px,100%);margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.logo{display:flex;flex-direction:column;align-items:center;padding:12vh 0 6vh;text-align:center}
.logo svg{width:min(420px,90%);height:auto}
.logo .sub{font-family:var(--f-story);letter-spacing:.5em;color:#d9d3c6;font-size:14px;margin-top:6px;opacity:.8}
.readback{align-self:center;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);padding:4px 12px;border-radius:999px;background:rgba(18,18,20,.6);border:1px solid var(--line)}
.begin{align-self:center;text-align:center;padding:14px 26px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.begin small{display:block;font-size:10px;letter-spacing:.24em;color:var(--mute)}
.begin b{display:block;font-family:var(--f-story);font-size:20px;font-weight:600;margin-top:2px}
.arrival{align-self:center;text-align:center;margin:8px 0}
.arrival small{display:block;font-size:10px;letter-spacing:.24em;color:var(--mute)}
.arrival b{display:block;font-family:var(--f-story);font-size:17px;font-weight:600;margin:3px 0}
.arrival span{font-size:12px;color:var(--ink-2)}
.msg{display:flex;flex-direction:column;gap:6px}
.msg.me{align-items:flex-end}
.chiprow{display:flex;align-items:center;gap:8px}
.msg.me .chiprow{flex-direction:row-reverse}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px 0 4px;border-radius:999px;background:rgba(18,18,20,.82);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip .av{width:20px;height:20px;border-radius:50%;overflow:hidden;background:#2a2a2e;display:grid;place-items:center;font-size:10px;color:var(--gold)}
.chip .av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.chip em{font-style:italic;font-weight:400;color:var(--mute);font-size:12px;font-family:var(--f-story)}
.more{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);margin-left:auto;opacity:.7}
.msg.me .more{margin-left:0;margin-right:auto}
.more:hover{opacity:1;background:rgba(255,255,255,.08)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px;backdrop-filter:blur(6px)}
.card .txt{font-family:var(--f-story);font-size:17px;line-height:1.75;color:var(--ink)}
.card .txt p+p{margin-top:10px}
.msg.me .card{max-width:80%;padding:10px 16px}
.msg.me .card .txt{font-size:15px}
.pager{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--ink-2)}
.pager button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.pager button:hover{background:rgba(255,255,255,.08)}
.pager .pd{flex:1;display:flex;justify-content:center;gap:5px;align-items:center}
.pager .pd i{width:12px;height:2px;background:rgba(255,255,255,.3);border-radius:1px}
.pager .pd i.on{background:#fff}
.pager .pd i.end{width:6px;height:6px;transform:rotate(45deg);border-radius:1px;background:rgba(255,255,255,.4)}
.pager .pd i.end.on{background:#fff}
.roll{display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 14px;border-radius:999px;background:rgba(18,18,20,.82);border:1px solid var(--line);font-size:12.5px}
.roll .mono{color:var(--ink-2);font-size:12px}
.roll b{font-weight:600}
.roll.ok b{color:var(--green)} .roll.bad b{color:var(--red)}
.ask{font-size:12px;color:var(--mute);padding:0 4px}
.sysl{align-self:center;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:rgba(18,18,20,.6)}
.sysl.warn{color:#f0a196}
.toast{align-self:center;display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:12px;background:var(--card);border:1px solid rgba(217,180,106,.4);font-size:12.5px}
.toast b{font-family:var(--f-story);color:var(--gold);font-size:14px}
.toast span{color:var(--ink-2)}
.chapter{align-self:center;text-align:center;font-family:var(--f-story);font-size:16px;color:var(--ink-2);padding:10px 0;letter-spacing:.04em}
.chapter p{font-size:13px;margin-top:4px}
.thinking{font-family:var(--f-story);font-style:italic;color:var(--mute)}
.intro .card{padding:20px 22px}
.intro label{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px;font-family:var(--f-ui)}
.intro input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-family:var(--f-ui);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-family:var(--f-ui);background:rgba(255,255,255,.03)}
.opt[aria-pressed="true"]{border-color:var(--accent-2);background:rgba(109,99,245,.18)}
.opt small{color:var(--mute);margin-left:4px}
.compose{padding:10px 0 0;background:none}
.compose-old{background:linear-gradient(180deg,rgba(10,10,12,0),rgba(10,10,12,.7) 30%)}
.compose-in{width:min(640px,100%);margin:0 auto;position:relative}
.dockc{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 64px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dockc>*{pointer-events:auto}
.stage.chat .dockc{background:linear-gradient(180deg,rgba(10,10,12,0),rgba(10,10,12,.82) 40%)}
.viewsw{position:absolute;z-index:6;top:12px;left:calc(max(12px,env(safe-area-inset-left,0px)) + 44px);display:flex;padding:3px;border-radius:999px;background:rgba(18,18,20,.72);border:1px solid var(--line);backdrop-filter:blur(8px)}
.viewsw button{height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.viewsw button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--ink)}
/* game-dialogue (VN) view */
.stage.vn .story{display:none}
.stage.vn .art::after{background:linear-gradient(180deg,rgba(10,10,12,.15),rgba(10,10,12,.2) 50%,rgba(10,10,12,.7))}
.stage.vn.waiting .art::after{background:rgba(10,10,12,.55)}
.stage.chat .vn{display:none}
.vn{width:min(640px,100%);margin:0 auto;display:flex;flex-direction:column;gap:10px}
.vn-media{border-radius:16px;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 18px 50px rgba(0,0,0,.5);position:relative}
.vn-media.arr{height:min(36vh,300px);background:#111 center/cover}
.vn-media.arr::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.8))}
.vn-media.arr div{position:absolute;left:18px;bottom:16px;z-index:1}
.vn-media.arr small{font-size:10.5px;letter-spacing:.24em;color:var(--ink-2)}
.vn-media.arr b{display:block;font-family:var(--f-story);font-size:30px;font-weight:500;line-height:1.2}
.vn-media.arr span{font-size:12.5px;color:var(--ink-2)}
.vn-media.map{background:#0b1418}
.vn-media.map img{display:block;width:100%;max-height:44vh;object-fit:cover}
.vn-media.map .pin i{width:10px;height:10px;background:var(--gold);border:2px solid #fff}
.vn-media.map .pin span{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:10.5px;background:rgba(0,0,0,.75);padding:0 5px;border-radius:3px;white-space:nowrap}
.vn-media.map .pin.you i{width:16px;height:16px;background:var(--accent)}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route line{vector-effect:non-scaling-stroke;stroke-linecap:round}
.route line.u{stroke:rgba(0,0,0,.55);stroke-width:6}
.route line.c{stroke:#f3d08a;stroke-width:3;stroke-dasharray:2 8}
.pin.dest i{position:relative}
.pin.dest::after{content:"";position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid #f3d08a;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
.pin.you.sail{animation:sail 2.4s ease-in-out forwards}
@keyframes sail{from{left:var(--x0);top:var(--y0)}to{left:var(--x1);top:var(--y1)}}
.mvbar .t i.sail{animation:grow 2.4s ease-in-out}
.mvbar button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.mvbar button:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.stage.mapbeat .minimap{opacity:0;pointer-events:none}
.minimap{transition:opacity .3s}
/* map card in the list, like a travel log entry */
.mapcard{border-radius:14px;overflow:hidden;border:1px solid var(--line-2);background:#141416}
.mapcard .m{position:relative;height:240px;overflow:hidden;background:#0b1418}
.mapcard .m .z{position:absolute;inset:0;transition:transform .3s}
.mapcard .m img{width:100%;height:100%;object-fit:cover;display:block}
.mapcard .m .pin span{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:10px;background:rgba(0,0,0,.75);padding:0 5px;border-radius:3px;white-space:nowrap}
.mapcard .m .pin i{width:9px;height:9px;background:var(--gold);border:2px solid #fff}
.mapcard .m .pin.you i{width:14px;height:14px;background:var(--accent)}
.mapcard .zb{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:2}
.mapcard .zb button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(18,18,20,.8);border:1px solid var(--line);color:var(--ink)}
.mapcard .cap{display:flex;align-items:center;gap:10px;padding:10px 14px;font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2)}
.mapcard .cap .av{width:26px;height:26px;border-radius:7px;background:#2a2a2e;display:grid;place-items:center;color:var(--gold);font-family:var(--f-story);font-size:13px}
/* per-message actions menu */
.msgmenu{position:fixed;z-index:40;width:210px;background:#1a1a1d;border:1px solid var(--line-2);border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.msgmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;font-size:13px;text-align:left}
.msgmenu button:hover{background:rgba(255,255,255,.06)}
.msgmenu button:disabled{opacity:.4;pointer-events:none}
.msgmenu button.danger{color:#f0a196}
.msgmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.msgmenu small{display:block;padding:2px 10px 6px;font-size:11px;color:var(--mute)}
.toastmsg{position:fixed;z-index:50;left:50%;bottom:120px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:#eeece8;color:#111;font-size:12.5px;animation:vnin .25s ease}
.vn-you{align-self:flex-end;max-width:82%;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.vn-you .card{padding:10px 16px}
.vn-you .card .txt{font-size:15.5px}
.vn-box .card{min-height:118px;display:flex;flex-direction:column;cursor:pointer}
.vn-box .card .txt{flex:1;font-size:18px;line-height:1.8}
.vn-box .card .txt.fade{animation:vnin .35s ease}
@keyframes vnin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vn-box .pager{margin-top:12px}
.vn-box .turnbtn{flex:none;display:flex;align-items:center;gap:4px;white-space:nowrap;font-family:var(--f-ui);font-size:12.5px;font-weight:500;color:#111;background:#eeece8;padding:4px 12px;border-radius:999px}
.vn-box .turnbtn:hover{background:#fff}
.vn-box .nextbtn{flex:none;display:flex;align-items:center;gap:4px;white-space:nowrap;font-family:var(--f-ui);font-size:12.5px;color:var(--ink-2);padding:4px 8px 4px 12px;border-radius:999px}
.vn-box .nextbtn:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.vn-box .yourturn{flex:none;white-space:nowrap;font-family:var(--f-ui);font-size:12px;color:var(--ink-2)}
.vn-box .pager .pd{min-width:0}
.fxrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:10px;font-family:var(--f-ui)}
.fxrow .who{font-size:12.5px}
.fxrow .who small{color:var(--mute);margin-left:4px}
.fxchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line-2);background:rgba(0,0,0,.25);margin:2px 4px 2px 0}
.fxchip.up{color:var(--green);border-color:rgba(87,192,106,.4)} .fxchip.down{color:#f0a196;border-color:rgba(217,91,82,.4)} .fxchip.item{color:var(--gold);border-color:rgba(217,180,106,.45)}
.mv{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:14px}
.mv i{color:var(--sea);font-style:normal}
.mvbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-family:var(--f-ui);font-size:11.5px;color:var(--mute)}
.mvbar .t{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.mvbar .t i{display:block;height:100%;width:100%;background:var(--ink-2);animation:grow 1.2s ease}
@keyframes grow{from{width:0}to{width:100%}}
.skel{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.skel i{height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.skel .st{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.stopbtn{align-self:flex-end;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.rb{align-self:center;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);padding:4px 12px;border-radius:999px;background:rgba(18,18,20,.6);border:1px solid var(--line)}
.rb:hover{color:var(--ink)}
.sprite{position:absolute;z-index:1;top:12vh;left:calc(50% - 300px);transform:translateX(-50%);height:132vh;aspect-ratio:2/3;background:center top/contain no-repeat;pointer-events:none;filter:drop-shadow(0 20px 40px rgba(0,0,0,.55));-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 66%);mask-image:linear-gradient(180deg,#000 50%,transparent 66%)}
.sprite.in{animation:spin .45s cubic-bezier(.2,.7,.2,1)}
@keyframes spin{from{opacity:0;transform:translateX(calc(-50% - 40px))}to{opacity:1;transform:translateX(-50%)}}
.stage.chat .sprite{display:none}
/* the player's own figure, bottom-left in the list view (like Craft) */
.pcfig{position:absolute;z-index:3;left:max(12px,calc(50% - 640px));bottom:0;height:min(46vh,420px);aspect-ratio:2/3;padding:0;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 98%);mask-image:linear-gradient(180deg,#000 62%,transparent 98%);transition:transform .25s,filter .25s;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.pcfig img{width:100%;height:100%;object-fit:contain;object-position:bottom}
.pcfig:hover{transform:translateY(-6px);filter:drop-shadow(0 10px 24px rgba(0,0,0,.5)) brightness(1.08)}
.stage.vn .pcfig{display:none}
@media (max-width:1240px){.pcfig{display:none}}
.rail-r .av img{width:100%;height:100%;object-fit:cover;object-position:50% 8%}
.motto{font-family:var(--f-story);font-style:italic;font-size:13px;color:var(--ink-2);margin:-2px 0 10px}
.bio label{display:block;font-size:11.5px;color:var(--mute);margin:0 0 10px}
.bio input,.bio textarea{display:block;width:100%;margin-top:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font:inherit;font-size:13.5px;line-height:1.6;resize:vertical}
.bio input:focus,.bio textarea:focus{outline:none;border-color:var(--accent-2)}
.bio2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage.vn .vn{position:relative;z-index:2}
/* tap zones on both sides of the dialogue box */
.hot{display:none;position:absolute;z-index:3;top:130px;bottom:0;width:calc(50% - 330px);min-width:56px;cursor:pointer;color:rgba(255,255,255,.0);font-size:44px;font-family:var(--f-ui);transition:background .2s,color .2s}
.hot.l{left:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,0))}
.hot.r{right:0}
.hot span{position:absolute;top:50%;transform:translateY(-50%)}
.hot.l span{left:24px} .hot.r span{right:24px}
.hot:hover{color:rgba(255,255,255,.85)}
.hot.l:hover{background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
.hot.r:hover{background:linear-gradient(270deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
.hot:active{background:rgba(255,255,255,.06)}
.stage.vn:not(.waiting) .hot{display:block}
.nudge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin:0 4px 8px;cursor:pointer;font-family:var(--f-story);font-style:italic}
.nudge:hover{color:var(--ink)}
.box{background:rgba(20,20,22,.9);border:1px solid var(--line-2);border-radius:16px;padding:12px 12px 8px 16px;backdrop-filter:blur(8px)}
.box textarea{display:block;width:100%;resize:none;border:0;background:transparent;font-family:var(--f-story);font-size:16px;line-height:1.6;height:28px;max-height:140px;outline:none;padding:2px 0}
.box textarea::placeholder{color:var(--mute)}
.box .row{display:flex;align-items:center;gap:6px;margin-top:6px}
.box .row .sp{flex:1}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.go{width:32px;height:32px;border-radius:50%;background:#eeece8;color:#111;display:grid;place-items:center}
.go svg{fill:#111;stroke:none;width:14px;height:14px;margin-left:2px}
.pop{position:absolute;z-index:8;bottom:calc(100% + 6px);background:#1a1a1d;border:1px solid var(--line-2);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left}
.pop button:hover:not(:disabled){background:rgba(255,255,255,.06)}
.pop h5{margin:4px 10px 6px;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.06em}
.notice{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);padding:9px 12px;border-radius:12px;background:rgba(20,20,22,.9);border:1px solid var(--line);margin-bottom:8px}

/* docked side panel */
.side{width:400px;flex:none;background:#131315;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.side-hd .k{font-size:10px;letter-spacing:.18em;color:var(--mute);display:block}
.side-hd h3{font-size:14px}
.side-hd .sp{flex:1}
.side-body{flex:1;overflow-y:auto;padding:12px}
.pcard{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pcard>h4{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:10px}
.member{display:inline-flex;flex-direction:column;align-items:center;gap:4px;width:84px;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.03);font-size:11.5px;margin:0 6px 6px 0}
.member .av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#2a2a2e;display:grid;place-items:center;color:var(--gold)}
.member .av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.member .hb{width:56px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.member .hb i{display:block;height:100%;background:var(--green)}
.member small{font-family:var(--f-mono);font-size:10px;color:var(--mute)}
.sight{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.sight .av{width:22px;height:22px;border-radius:50%;overflow:hidden;background:#2a2a2e;display:grid;place-items:center;font-size:10px;color:var(--gold)}
.sight .av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.sight b{margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:12px}
.sight.no{opacity:.45}

/* dossier (character / NPC file) */
.dossier{border-radius:14px;overflow:hidden;background:#141416;border:1px solid var(--line)}
.dossier .por{position:relative;height:300px;background:#1d1d20 center 12%/cover no-repeat;display:grid;place-items:center;font-family:var(--f-story);font-size:60px;color:var(--gold)}
.dossier .por::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#141416)}
.dossier .id{position:relative;z-index:1;margin-top:-86px;text-align:center;padding:0 18px 14px}
.dossier .id small{font-size:10px;letter-spacing:.24em;color:var(--red)}
.dossier .id h2{font-family:var(--f-story);font-size:24px;font-weight:600;margin:2px 0 10px}
.vbar{display:flex;align-items:center;gap:8px;margin:5px auto;max-width:260px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.vbar .t{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.vbar .t i{display:block;height:100%}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.sgrid div{background:#161618;padding:10px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.sgrid small{font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.sgrid b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:10px;overflow-x:auto}
.tabs button{flex:1;padding:6px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.1);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.li{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;font-size:13px;width:100%;text-align:left}
button.li:hover{background:rgba(255,255,255,.05)}
.li .av{width:30px;height:30px;border-radius:8px;overflow:hidden;background:#2a2a2e;display:grid;place-items:center;flex:none;color:var(--gold)}
.li .av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.li .tx{flex:1;min-width:0}
.li small{display:block;color:var(--mute);font-size:11.5px}
.li .v{font-family:var(--f-mono);font-size:12px}
.pos{color:var(--green)} .neg{color:var(--red)}
.memo{border-left:2px solid var(--line-2);padding:2px 0 2px 12px;margin-bottom:10px;color:var(--ink-2);font-size:13px;font-family:var(--f-story)}
.memo.rumor{border-color:#8f86ff}
.memo small{display:block;color:var(--mute);font-size:11px;font-family:var(--f-ui)}
.empty{color:var(--mute);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:8px;padding:7px 14px;font-weight:500;font-size:13px}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink)}
.actcard{border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#2a1414,#151517 160px);border:1px solid rgba(217,91,82,.35);padding:16px}
.actcard .k{font-size:10px;letter-spacing:.24em;color:#e88a80;text-align:center}
.actcard h2{font-family:var(--f-deco);font-size:22px;letter-spacing:.06em;margin:8px 0 4px}
.actcard .q{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.actcard .q div{border:1px solid rgba(217,91,82,.35);border-radius:8px;padding:6px 10px;background:rgba(0,0,0,.25)}
.actcard .q small{font-size:10px;letter-spacing:.12em;color:#e88a80;display:block}
.actcard .q b{font-size:13px}
.prose{font-family:var(--f-story);font-size:14px;line-height:1.8;color:var(--ink-2)}
.prose h3{font-family:var(--f-story);color:var(--ink);font-size:17px;margin:4px 0 8px}
.prose ul{padding-left:18px;margin:6px 0}
.prose b{color:var(--ink)}
.mapbig{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mapbig img{display:block;width:100%}
.mapbig .pin i{width:10px;height:10px;background:var(--gold);border:2px solid #fff}
.mapbig .pin span{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:10.5px;background:rgba(0,0,0,.75);padding:0 5px;border-radius:3px;white-space:nowrap}
.mapbig .pin.you i{width:16px;height:16px;background:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.mbox{width:min(780px,100%);max-height:86vh;background:#161618;border:1px solid var(--line-2);border-radius:16px;display:grid;grid-template-columns:200px 1fr;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mbox .nav{background:#131315;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.mbox .nav h3{font-size:15px;padding:0 8px}
.mbox .nav p{font-size:11.5px;color:var(--mute);padding:0 8px 12px}
.mbox .nav button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;text-align:left;color:var(--ink-2)}
.mbox .nav button[aria-selected="true"]{background:rgba(255,255,255,.08);color:var(--ink)}
.mbox .nav .sp{flex:1}
.mbox .main{overflow-y:auto;padding:18px 20px;position:relative}
.mbox .main h4{font-size:13.5px;margin:4px 0 8px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:8px}
.setrow .tx{flex:1;min-width:0}
.setrow small{display:block;color:var(--mute);font-size:11.5px}
.setrow select{background:#222226;border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;font-size:12.5px}
.tog{width:34px;height:20px;border-radius:10px;background:#3a3a40;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"]::after{left:17px}
.tagx{font-size:10.5px;padding:1px 7px;border-radius:999px;background:rgba(87,192,106,.15);color:var(--green);margin-left:6px}
.xbtn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.xbtn:hover{background:rgba(255,255,255,.08)}
.palette{width:min(560px,100%);background:#1a1a1d;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;align-self:start;margin-top:12vh}
.palette input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;outline:none}
.palette .res{max-height:50vh;overflow-y:auto;padding:6px}

/* ================= WORKSPACE ================= */
#ws{position:fixed;inset:0;display:grid;grid-template-rows:44px minmax(0,1fr);grid-template-columns:48px minmax(0,1fr) 340px;padding-top:env(safe-area-inset-top,0px);background:#0f0f11}
#ws.noasst{grid-template-columns:48px minmax(0,1fr) 0}
#ws.noasst .asst{display:none}
.wtop{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.wtop .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px;min-width:0;white-space:nowrap}
.wtop .brand .lg{width:22px;height:22px;border-radius:6px;background:#222;display:grid;place-items:center;color:var(--gold)}
.wtop .search{margin:0 auto;display:flex;align-items:center;gap:8px;width:min(420px,40vw);height:30px;padding:0 10px;border-radius:8px;background:#19191c;border:1px solid var(--line);color:var(--mute);font-size:13px}
.wtop .search kbd{margin-left:auto;font-family:var(--f-ui);font-size:10.5px;padding:1px 6px;border-radius:4px;background:#26262a}
.wtop .playbtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:500;font-size:13px}
.wrail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 10px}
.wrail button{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.wrail button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.wrail button[aria-current="true"]{color:var(--ink);background:rgba(109,99,245,.18)}
.wrail button[aria-current="true"]::before{content:"";position:absolute;left:-7px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent-2)}
.wrail .sp{flex:1}
.wrail .me{width:28px;height:28px;border-radius:50%;background:#2a2a2e;display:grid;place-items:center;font-size:12px;color:var(--gold)}
.wmain{min-width:0;min-height:0;margin:0 0 8px;border:1px solid var(--line);border-radius:10px;background:#121214;overflow:hidden;display:flex}
.asst{min-height:0;margin:0 8px 8px;border:1px solid var(--line);border-radius:10px;background:#121214;display:flex;flex-direction:column}
.asst-hd{display:flex;align-items:center;gap:6px;padding:8px}
.asst-hd .newc{height:26px;padding:0 10px;border-radius:7px;background:#1e1e22;border:1px solid var(--line);font-size:12px}
.asst-hd .sp{flex:1}
.asst-body{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.asst-hello{margin:auto 0;text-align:center}
.blob{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;background:radial-gradient(circle at 35% 30%,#d9f1ff,#7cc4f5 45%,#3d86d8);position:relative;box-shadow:0 0 30px rgba(124,196,245,.35)}
.blob::before,.blob::after{content:"";position:absolute;top:22px;width:6px;height:6px;border-radius:50%;background:#14243a}
.blob::before{left:18px}.blob::after{right:18px}
.asst-hello h3{font-size:17px;margin-bottom:14px}
.asst-hello button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);text-align:left}
.asst-hello button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.bub{font-size:13px;line-height:1.65;padding:9px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:#26263a}
.bub.a{align-self:flex-start;background:#1b1b1f;border:1px solid var(--line)}
.asst-note{margin:0 10px 8px;display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);padding:8px 10px;border-radius:10px;border:1px solid rgba(87,192,106,.3);background:rgba(87,192,106,.06)}
.asst-note b{color:var(--green);font-weight:500}
.asst-in{margin:0 10px 10px;border:1px solid var(--line-2);border-radius:12px;background:#17171a;padding:8px 10px}
.asst-in .ctx{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.asst-in textarea{width:100%;background:transparent;border:0;outline:none;resize:none;height:40px;font-size:13px}
.asst-in .row{display:flex;align-items:center;gap:6px}
.asst-in .model{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(109,99,245,.6);font-size:11.5px;color:#c9c4ff;margin-left:auto}
.asst-in .send2{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff}

/* files place */
.tree{width:240px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tree-tools{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tree-tools button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2)}
.tree-tools button[aria-pressed="true"]{background:rgba(255,255,255,.08);color:var(--ink)}
.tree-tools .sp{flex:1}
.tree-body{flex:1;overflow-y:auto;padding:6px}
.node{display:flex;align-items:center;gap:6px;width:100%;height:28px;padding:0 6px;border-radius:6px;font-size:13px;color:var(--ink);text-align:left;white-space:nowrap}
.node:hover{background:rgba(255,255,255,.04)}
.node[aria-current="true"]{background:rgba(255,255,255,.08)}
.node .car{width:12px;color:var(--mute);font-size:10px;transition:transform .15s}
.node .car.open{transform:rotate(90deg)}
.node .fi{color:var(--folder)}
.node .ff{color:#a99ff8}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.node .ct{font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.node.leaf{padding-left:24px}
.node.leaf .ff{color:var(--folder)}
.node.sub{padding-left:18px}
.tsearch{margin:4px 6px 6px 24px;display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--mute)}
.tsearch input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:12.5px}
.files{flex:1;min-width:0;display:flex;flex-direction:column}
.ftabs{display:flex;align-items:stretch;height:34px;border-bottom:1px solid var(--line);overflow-x:auto}
.ftab{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-right:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap;max-width:200px}
.ftab[aria-selected="true"]{background:#1a1a1d;color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent-2)}
.ftab .x{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--mute)}
.ftab .x:hover{background:rgba(255,255,255,.08)}
.ftab .nm{overflow:hidden;text-overflow:ellipsis}
.ftool{display:flex;align-items:center;gap:4px;height:34px;padding:0 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.ftool b{color:var(--ink);font-weight:500;margin-right:8px}
.ftool button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
.ftool button[aria-pressed="true"]{background:rgba(255,255,255,.08);color:var(--ink)}
.ftool .sp{flex:1}
.fview{flex:1;overflow-y:auto;padding:14px}
.fview .narrow{max-width:540px;margin:0 auto}
.fempty{flex:1;display:grid;place-items:center;text-align:center;color:var(--mute)}
.fempty .ic{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 10px}
.fhead h2{font-size:20px}
.fhead p{font-size:12px;color:var(--mute);margin:2px 0 12px}
.frow{display:flex;gap:8px;margin-bottom:12px}
.fsearch{flex:1;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#161618;color:var(--mute)}
.fsearch input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#161618;font-size:11.5px;text-align:center;padding:6px;overflow:hidden;position:relative}
.tile:hover{border-color:var(--line-2)}
.tile .fi{width:26px;height:26px;color:var(--folder)}
.tile.img{padding:0;justify-content:flex-end}
.tile.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.tile.img span{position:relative;width:100%;padding:16px 6px 6px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));font-weight:500}
.tile .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.tile.ph{border-style:dashed;opacity:.4}
.locard{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#141416}
.locard .im{height:220px;background:#1d1d20 center/cover}
.locard .bd{padding:14px 16px}
.locard h2{font-family:var(--f-story);font-size:22px}
.badge2{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--ink-2);margin:4px 4px 0 0}
.badge2.secret{background:rgba(217,91,82,.15);color:#f0a196}
.badge2.go{background:rgba(227,163,59,.15);color:var(--amber)}
.badge2.ok{background:rgba(109,99,245,.18);color:#c9c4ff}
.badge2.done{background:rgba(87,192,106,.15);color:var(--green)}
.secretbox{margin-top:12px;border:1px dashed rgba(217,91,82,.45);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#f0c2bb;background:rgba(217,91,82,.06)}
.secretbox b{display:block;font-size:10.5px;letter-spacing:.14em;color:#f0a196;margin-bottom:4px}
.code{font-family:var(--f-mono);font-size:12px;line-height:1.6;white-space:pre-wrap;background:#0d0d0f;border:1px solid var(--line);border-radius:10px;padding:12px;color:#cfd3dc}

/* overview place */
.ov{flex:1;overflow-y:auto}
.ov-hero{position:relative;height:440px;background-color:#111;background-position:center 30%;background-size:cover;background-repeat:no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px}
.ov-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,15,17,.25),rgba(15,15,17,.45) 55%,#121214)}
.ov-hero>*{position:relative;z-index:1}
.ov-hero .lite{font-size:11px;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid var(--line-2);margin-bottom:20px}
.ov-hero svg{width:min(460px,90%);height:auto}
.emblem{display:flex;align-items:center;gap:14px;width:min(560px,90%);margin:-30px auto 0;position:relative;z-index:1}
.emblem::before,.emblem::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.25)}
.emblem i{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;background:#121214;color:var(--gold);font-style:normal}
.ov-tag{max-width:520px;margin:16px auto 40px;text-align:center;font-size:14px;line-height:1.7;color:var(--ink-2);padding:0 20px}
.ov-sec{padding:36px 36px;border-top:1px solid var(--line)}
.ov-eyebrow{font-size:10.5px;letter-spacing:.22em;color:var(--mute);margin-bottom:10px}
.ov-split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:30px}
.ov-big{font-family:"Outfit",var(--f-ui);font-weight:400;font-size:30px;line-height:1.15;letter-spacing:.02em}
.ov-prose{font-size:14px;line-height:1.85;color:var(--ink-2)}
.ov-prose p+p{margin-top:12px}
.glimpses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.glimpses img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.ov-note{font-style:italic;color:var(--ink-2);font-size:14px}
.ov-h{font-family:"Outfit",var(--f-ui);font-weight:400;font-size:28px;letter-spacing:.04em;margin-bottom:16px}
.comp{width:210px;border-radius:14px;border:1px solid var(--line);background:#17171a;padding:16px;text-align:left}
.comp h4{font-size:13px;letter-spacing:.1em;margin:14px 0 2px}
.comp small{color:var(--mute);font-size:11.5px}
.comp p{font-size:12.5px;color:var(--ink-2);margin:8px 0}
.comp .ft{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:12px}
.comp .ft b{color:var(--accent-2);font-weight:500}
.wmap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.wmap .mapbig{background:#0b1418}
.plist{border-radius:12px;border:1px solid var(--line);background:#17171a;overflow:hidden;display:flex;flex-direction:column;max-height:420px}
.plist .hd{padding:12px 14px;border-bottom:1px solid var(--line)}
.plist .hd small{font-size:10px;letter-spacing:.2em;color:var(--mute)}
.plist .hd h4{font-size:15px;font-weight:500}
.plist .bd{overflow-y:auto;padding:6px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:8px;text-align:left}
.prow:hover{background:rgba(255,255,255,.04)}
.prow img{width:36px;height:36px;border-radius:6px;object-fit:cover}
.prow b{display:block;font-size:13px;font-weight:500}
.prow small{color:var(--accent-2);font-size:11.5px}
.prow .tx{flex:1;min-width:0}
.prow .go2{width:26px;height:26px;border-radius:6px;background:#222226;display:grid;place-items:center;color:var(--ink-2)}
.typerow{display:grid;grid-template-columns:120px minmax(0,1.3fr) minmax(0,1fr);gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}
.typerow h3{font-family:"Outfit",var(--f-ui);font-weight:400;font-size:20px;letter-spacing:.06em;margin-top:6px}
.typerow small{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--mute)}
.typerow .va{font-size:12px;color:var(--accent-2);margin-top:12px;display:inline-block}
.feat{position:relative;border-radius:12px;overflow:hidden;min-height:170px;background:#1d1d20 center 20%/cover;text-align:left;display:flex;align-items:flex-end}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.8))}
.feat span{position:relative;z-index:1;padding:12px 14px;font-family:var(--f-story);font-size:22px}
.feat.noimg{display:grid;place-items:center;font-family:var(--f-story);font-size:44px;color:var(--gold)}
.feat.noimg span{position:absolute;left:0;bottom:0;font-size:22px;color:var(--ink)}
.mini4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini4 button{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/10;background:#1d1d20 center 20%/cover;display:flex;align-items:flex-end;font-size:11.5px;text-align:left}
.mini4 button::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.8))}
.mini4 button span{position:relative;z-index:1;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.mini4 button.ni{display:grid;place-items:center;color:var(--gold);font-family:var(--f-story);font-size:20px}
.mini4 button.ni span{position:absolute;left:0;bottom:0;font-size:11.5px;color:var(--ink);font-family:var(--f-ui)}

/* map place */
.mapplace{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-width:0}
.mapcanvas{position:relative;background:#0c0c0e;display:grid;place-items:center;padding:20px;overflow:auto}
.mapcanvas .mapbig{width:min(760px,100%)}
.mapside{border-left:1px solid var(--line);overflow-y:auto}
.mapside .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.acc{border-bottom:1px solid var(--line)}
.acc div{display:flex;justify-content:space-between;padding:10px 14px;font-size:12px}
.acc div b{font-size:11px;letter-spacing:.12em;font-weight:600}
.acc div span{color:var(--mute)}

/* gm place */
.gm{flex:1;display:flex;flex-direction:column;min-width:0}
.gmtabs{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.gmtabs button{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.gmtabs button[aria-selected="true"]{background:rgba(255,255,255,.08);color:var(--ink)}
.gmtabs .ct{font-size:10.5px;color:var(--mute)}
.gmtabs .who{display:flex;align-items:center;gap:6px;padding-right:10px;margin-right:6px;border-right:1px solid var(--line);font-weight:500;font-size:13px}
.gmbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.gmbar .tx{flex:1}
.gmbar small{display:block;color:var(--mute);font-size:11.5px}
.budget{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#f0a196}
.budget .t{width:60px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.budget .t i{display:block;height:100%;background:var(--red)}
.gmbody{flex:1;overflow-y:auto;padding:12px 14px}
.ggroup{margin-bottom:18px}
.ggroup .gh{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.ggroup .gh .ct{color:var(--mute);font-weight:400;font-size:12px}
.ggroup .gh .t{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-left:auto}
.ggroup .gh .t i{display:block;height:100%;background:var(--green)}
.ggroup .gh .cc{font-size:11px;color:var(--mute)}
.inst{border:1px solid var(--line);border-radius:10px;background:#161618;margin-bottom:8px;overflow:hidden}
.inst .tg{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:10.5px;letter-spacing:.12em;font-weight:600;background:rgba(87,192,106,.08);color:var(--green)}
.inst.when .tg{background:rgba(227,163,59,.09);color:var(--amber)}
.inst.secret .tg{background:rgba(217,91,82,.09);color:#f0a196}
.inst .tg .cnd{letter-spacing:0;font-weight:400;color:var(--ink);font-size:12px}
.inst .tg .cc{margin-left:auto;display:flex;align-items:center;gap:6px;letter-spacing:0;font-weight:400;color:var(--mute)}
.inst .tg .cc i{width:50px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);display:block;overflow:hidden}
.inst .tg .cc i u{display:block;height:100%;background:currentColor;text-decoration:none}
.inst .bd{padding:8px 12px 10px}
.inst h4{font-size:13.5px;margin-bottom:3px}
.inst p{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.addinst{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px;border-radius:8px;font-size:12.5px;color:var(--ink-2)}
.addinst:hover{background:rgba(255,255,255,.04)}

@media (max-width:1100px){#ws{grid-template-columns:48px minmax(0,1fr) 0}#ws .asst{display:none}#ws.showasst{grid-template-columns:48px 0 minmax(0,1fr)}#ws.showasst .asst{display:flex}#ws.showasst .wmain{display:none}}
@media (max-width:1240px){.sprite{left:30%;height:118vh}}
@media (max-width:900px){.sprite{left:50%;top:10vh;height:100vh;opacity:.9}}
@media (max-width:900px){.hot{width:32%;bottom:46%;top:120px}.hot span{display:none}
.side{position:fixed;inset:0;z-index:40;width:100%}.minimap{display:none}.ov-split,.wmap,.typerow{grid-template-columns:1fr}.mapplace{grid-template-columns:1fr}.mapside{display:none}}
@media (max-width:700px){
  .story{padding:64px 52px 200px max(14px,env(safe-area-inset-left,0px))}
  .dockc{padding:0 52px calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  .viewsw{top:54px;left:max(12px,env(safe-area-inset-left,0px))}
  .vn-box .card .txt{font-size:16px}
  .card{padding:14px 16px}.card .txt{font-size:15.5px}
  .tree{position:absolute;z-index:5;height:100%;background:#121214;display:none}
  .wmain{position:relative}
  .wmain.showtree .tree{display:flex}
  .wtop .search{display:none}
  .ov-sec{padding:28px 18px}
  .mbox{grid-template-columns:1fr}.mbox .nav{display:none}
  .glimpses{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:no-preference){.side{animation:sin .2s ease}@keyframes sin{from{transform:translateX(16px);opacity:.5}to{transform:none;opacity:1}}}

/* ---- local scene maps ---- */
.minimap .mz{position:absolute;inset:0;transform-origin:50% 50%}
.minimap .mz img{width:100%;height:100%;object-fit:cover;display:block}
.minimap .spot span,.minimap .npcdot span{display:none}
.minimap .spot.here span{display:block;font-size:8.5px;top:7px}
.minimap .npcdot{width:8px;height:8px}.minimap .npcdot img{border-width:1px}
.minimap .pin.you i{width:12px;height:12px}
.minimap.swap .mz,.minimap.swap>img{animation:mmswap 1.1s cubic-bezier(.2,.7,.2,1)}
@keyframes mmswap{0%{opacity:0;filter:blur(8px) brightness(1.6);scale:1.6}60%{opacity:1;filter:blur(0)}100%{scale:1}}
.minimap.walk .walker{animation:var(--wk) 1.8s linear both}
.minimap.walk .trail .c{animation:draw 1.2s ease-in-out both}
.spot{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.spot i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.spot span{position:absolute;left:50%;top:9px;transform:translateX(-50%);font-family:var(--f-ui);font-size:10.5px;color:#fff;background:rgba(0,0,0,.62);padding:1px 6px;border-radius:4px;white-space:nowrap}
.spot.here i{background:var(--gold)}
.spot.here span{color:var(--gold)}
.npcdot{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px}
.npcdot img,.npcdot i{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 12%;border:1.5px solid #c9c2ff;box-shadow:0 2px 6px rgba(0,0,0,.5);background:#8a82ff}
.npcdot span{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);font-family:var(--f-ui);font-size:9.5px;color:#ddd8ff;background:rgba(10,10,20,.7);padding:0 4px;border-radius:3px;white-space:nowrap}
.pin.you.walker i{background-size:cover;background-position:50% 10%}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail line,.trail polyline{vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;fill:none}
.trail .u{stroke:rgba(0,0,0,.4);stroke-width:6}
.trail .u{stroke-dasharray:none}
.trail .c{stroke:#f3d08a;stroke-width:3;stroke-dasharray:2 7}
.trail .c.sea{stroke:#d6f1ff;stroke-width:2.5;stroke-dasharray:7 6}
@keyframes walk{0%,24%{left:var(--x0);top:var(--y0)}82%,100%{left:var(--x1);top:var(--y1)}}
@keyframes draw{0%,20%{opacity:0}34%,100%{opacity:1}}
@keyframes cam{0%{transform:scale(1)}24%{transform:var(--tA)}82%,100%{transform:var(--tB)}}
@keyframes popin{0%,82%{opacity:0;scale:.4}100%{opacity:1;scale:1}}
.scard{border-radius:14px;overflow:hidden;border:1px solid var(--line-2);background:#141416}
.scard .m{position:relative;height:260px;overflow:hidden;background:#0b1418}
.scard .m .z{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .35s}
.scard .m .z>img{width:100%;height:100%;object-fit:cover;display:block}
.scard .m.play .z{animation:var(--ck) 3.4s linear both;transition:none}
.scard .m.play .walker{animation:var(--wk) 3.4s linear both}
.scard .m.play .trail .c,.scard .m.play .trail .u{animation:draw 3.4s linear both}
.scard .m.play .npcdot{animation:popin 3.6s ease-out both}
.scard .m .spot span{font-size:9px}
.scard .where{position:absolute;left:10px;top:10px;z-index:2;display:flex;align-items:center;gap:5px;font-family:var(--f-ui);font-size:12px;background:rgba(10,10,12,.72);border:1px solid var(--line);padding:3px 9px;border-radius:7px}
.scard .rp,.arrcard .rp{position:absolute;right:10px;top:10px;z-index:3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(18,18,20,.8);border:1px solid var(--line);color:var(--ink)}
.scard .zb{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:2}
.scard .zb button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(18,18,20,.8);border:1px solid var(--line);color:var(--ink)}
.scard .cap{display:flex;align-items:center;gap:10px;padding:10px 14px;font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2)}
.scard .cap .av{width:26px;height:26px;border-radius:7px;overflow:hidden;background:#2a2a2e;flex:none}
.scard .cap .av img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.scard.vn-media .m{height:min(44vh,380px)}
.scard.vn-media .cap{display:none}
/* arrival: sea chart dives into the island -> local map -> the scene */
.arrcard{position:relative;height:200px;border-radius:14px;overflow:hidden;border:1px solid var(--line-2);background:#111 center/cover}
.arrcard.vn-media{height:min(40vh,330px)}
.arrcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.82));z-index:2;pointer-events:none}
.arrcard .cap{position:absolute;left:20px;bottom:16px;z-index:3}
.arrcard .cap small{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.24em;color:var(--ink-2)}
.arrcard .cap b{display:block;font-family:var(--f-story);font-size:30px;font-weight:500;line-height:1.2}
.arrcard .cap span{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-2)}
.arrcard .tw,.arrcard .tl{position:absolute;inset:0;opacity:0;z-index:1;pointer-events:none}
.arrcard .tw img,.arrcard .tl>img{width:100%;height:100%;object-fit:cover;display:block}
.arrcard .tl .spot span{font-size:9.5px}
.arrcard.play .tw{animation:arrW 3.6s cubic-bezier(.5,0,.3,1) both}
.arrcard.play .tl{animation:arrL 3.6s cubic-bezier(.4,0,.3,1) both}
.arrcard.play .cap{animation:arrT 3.6s ease-out both}
.arrcard.play::after{animation:arrT 3.6s ease-out both}
@keyframes arrW{0%{opacity:1;transform:scale(1)}30%{opacity:1;transform:scale(1.25)}46%{opacity:0;transform:scale(4.5)}100%{opacity:0;transform:scale(4.5)}}
@keyframes arrL{0%,32%{opacity:0;transform:scale(1.9);filter:blur(6px)}48%{opacity:1;filter:blur(0)}68%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1.5)}92%,100%{opacity:0;transform:scale(2.2)}}
@keyframes arrT{0%,80%{opacity:0;translate:0 10px}100%{opacity:1;translate:0 0}}
/* the map layer keeps the image's 3:2 shape and covers its box, so % pins stay on the art */
.minimap,.scard .m,.arrcard{container-type:size}
.minimap .mz,.scard .m .z,.arrcard .tl,.arrcard .tw{inset:auto;right:auto;bottom:auto;height:auto;left:50%;top:50%;width:max(100cqw,150cqh);aspect-ratio:3/2;translate:-50% -50%}
.minimap .mz img,.scard .m .z>img,.arrcard .tl>img,.arrcard .tw img{object-fit:fill}
.arrcard .tw{aspect-ratio:1448/1086;width:max(100cqw,133.4cqh)}
@media (prefers-reduced-motion:reduce){.scard .m.play *,.scard .m.play .z,.arrcard.play *,.arrcard.play::after,.minimap.swap *,.minimap.walk *{animation-duration:.01s!important}}

/* AI tip: three quick actions above the input */
.aitip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;margin-left:4px;border-radius:999px;border:1px solid rgba(243,208,138,.35);background:rgba(243,208,138,.08);color:var(--gold);font-family:var(--f-ui);font-size:12.5px}
.aitip .i{width:14px;height:14px}
.aitip:hover,.aitip[aria-expanded="true"]{background:rgba(243,208,138,.16)}
.pop.ideas{left:0;right:0;padding:10px}
.ideas .hd{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;font-family:var(--f-ui);font-size:12px;color:var(--mute)}
.ideas .hd b{color:var(--gold);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.ideas .hd .sp{flex:1}
.ideas .hd .rf{display:inline-flex;align-items:center;gap:5px;width:auto;padding:4px 8px;border-radius:7px;font-size:12px;color:var(--ink-2)}
.ideas .th{margin:0 4px 8px;font-family:var(--f-story);font-style:italic;font-size:13.5px;color:var(--ink-2)}
.ideas .opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ideas .card3{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:11px 12px 12px;border-radius:10px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);text-align:left;min-height:88px}
.ideas .card3:hover:not(:disabled){border-color:rgba(243,208,138,.5);background:rgba(243,208,138,.06)}
.ideas .card3 small{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.ideas .card3 span{font-family:var(--f-story);font-size:14.5px;line-height:1.45;color:var(--ink)}
.ideas .card3 .k{position:absolute;right:8px;top:8px;width:24px;height:24px;padding:0;border-radius:6px;display:grid;place-items:center;color:var(--mute)}
.ideas .card3 .k:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.ideas .card3.sk{animation:skel 1.2s ease-in-out infinite}
@keyframes skel{50%{opacity:.45}}
.ideas .card3.sk i{display:block;height:10px;border-radius:4px;background:rgba(255,255,255,.08);width:90%}
.ideas .card3.sk i+i{width:60%}
.ideas .ft{margin:8px 4px 0;font-family:var(--f-ui);font-size:11.5px;color:var(--mute)}
@media (max-width:700px){.ideas .opt3{grid-template-columns:1fr}.ideas .card3{min-height:0}.aitip{padding:0 9px}}
</style>

const LEGEND = `<p>盐风港的老人说，东边那座夜里不点灯的岛上，海水每隔几天就会退到不该退的地方，露出一道没人知道是谁修的石门。</p>
<p>有人说门里有一颗黑珍珠，黑得发亮，在月光下会泛出蓝色的光。也有人说，进去过的人回来以后，夜里总会梦见不认识的人。</p>
<p>三十年前，独眼贝恩说他去过。没有人信他。</p>
<p>今年，寻宝船长玛拉开始修她的灰鹭号，到处买淡水，谁问她要去哪儿，她都只是笑。码头上的人在猜，酒馆里的人在赌。</p>
<p>而你，刚刚接手了一艘缺淡水的小帆船。</p>`;
const LORE = [
  {folder:null, id:"01. 黑珍珠的传说", html:`<h1>黑珍珠的传说</h1>${LEGEND}
<blockquote>这片海不会等你，但也不会抛下你。</blockquote>
<p>你可以去找它，可以帮别人找它，可以阻止别人找到它，也可以根本不在乎它，就在港口好好过日子。无论你怎么选，世界都会照常运转，也都会记住你做过的事。</p>`},
  {folder:null, id:"02. 这片海的规矩", html:`<h1>这片海的规矩</h1>
<ul><li>想做什么就直接说。常规的事直接成功；有风险时，系统替你掷 d20，加上你的能力修正去比难度。</li>
<li>四项能力：体魄、身手、见识、交涉。</li>
<li>出海要淡水和口粮，按“天”计算。船体和士气也要照顾好。</li>
<li>只聊天、商量、翻资料，时间不会走。海上每个行动至少过去一小时。</li>
<li>失败不等于结束，总会留下别的路。默认没有永久死亡。</li>
<li>世界不会等你：别人有别人的打算，有些事你不去，它也会发生。</li></ul>`},
  {folder:null, id:"03. 称号与收藏栏", html:`<h1>称号与收藏栏</h1>
<p>你做过的事会变成称号，每个称号都附一句它的来历。有些称号会在你意想不到的时候出现。</p>
<p>等这段故事告一段落，你可以从这个世界里带走一件东西，放进账号的收藏栏。</p>`},
  {folder:"设计说明", id:"潮汐式主线", html:`<h1>设计说明：潮汐式主线</h1>
<p>开放世界最常见的问题是：玩家进门后不知道该干什么。完全没有剧情，兴头一过就会流失；剧情太死，又只剩一条路。</p>
<p>这个世界把<b>主线写成世界的日程，而不是玩家的任务</b>。主线只以“传说”的形式出现在世界介绍里，游玩界面不展示任何主线、章节或任务步骤。NPC 按自己的日程行动，玩家去不去，这些事都会发生。</p>
<h2>主线藏在哪里</h2>
<ul><li><b>世界介绍</b>：只写传说和悬念，不写答案。</li>
<li><b>罗盘念头</b>：角色自己的一句想法，给方向不给答案。</li>
<li><b>世界事件</b>：码头目击、酒馆传闻、拍卖告示，玩家只看到自己在场或听说的部分。</li>
<li><b>百科</b>：物品和线索要亲手拿到过才会出现；人物只写表面印象。</li></ul>
<h2>三种玩家</h2>
<div class="tbl"><table><tr><th>倾向</th><th>玩家在做什么</th><th>结局称号</th></tr>
<tr><td>顺流者</td><td>追着传说走</td><td>随潮者</td></tr>
<tr><td>逆流者</td><td>反着别人的期待来</td><td>逆潮者</td></tr>
<tr><td>守岸者</td><td>不理传说，好好过日子</td><td>守岸人</td></tr></table></div>
<h2>AI 主持人和规则系统的分工</h2>
<p>AI 主持人知道全部真相，但只按玩家已经知道的东西叙事。时间、航程、补给、NPC 日程、宝物归属由规则系统计算和校验。</p>`},
];

// shortest walk/row between two named places on a local map: {pts, modes(per segment)}
function scenePath(loc,from,to){
  const sc=SCENES[loc]; if(!sc) return null;
  const P={...sc.nodes,...sc.spots}, adj={};
  for(const e of sc.edges.split(" ")){ const [ab,m="l"]=e.split(":"), [a,b]=ab.split("-"); (adj[a]=adj[a]||[]).push([b,m]); (adj[b]=adj[b]||[]).push([a,m]); }
  if(!P[from]||!P[to]) return null;
  const d={[from]:0}, prev={}, done=new Set(), L=(a,b)=>Math.hypot((P[a][0]-P[b][0])*1.5,P[a][1]-P[b][1]);
  while(true){ let u=null; for(const k in d) if(!done.has(k)&&(u==null||d[k]<d[u])) u=k; if(u==null||u===to) break; done.add(u);
    for(const [v,m] of adj[u]||[]){ const nd=d[u]+L(u,v)*(m==="s"?1.15:1); if(nd<(d[v]??1e9)){ d[v]=nd; prev[v]=[u,m]; } } }
  if(from!==to&&!prev[to]) return {pts:[P[from],P[to]],modes:["l"]};
  const pts=[P[to]], modes=[]; let c=to; while(c!==from){ const [u,m]=prev[c]; pts.unshift(P[u]); modes.unshift(m); c=u; }
  return {pts,modes};
}

function spotKey(loc,spot){
  const sc=SCENES[loc]; if(!sc) return null;
  const s=String(spot||"");
  if(!s||s==="靠岸"||/燕鸥号|甲板|船上|船舱/.test(s)) return sc.dock;
  if(sc.spots[s]) return s;
  for(const k of Object.keys(sc.spots)) if(s.includes(k)||k.includes(s)) return k;
  for(const [a,k] of Object.entries(sc.alias)) if(s.includes(a)) return k;
  return null;
}

function parseReply(text){
  const i=text.indexOf("===STATE===");
  const narr=(i>=0?text.slice(0,i):text).trim();
  let st=null;
  if(i>=0){ const raw=text.slice(i+11); const a=raw.indexOf("{"),b=raw.lastIndexOf("}"); if(a>=0&&b>a){ try{st=JSON.parse(raw.slice(a,b+1));}catch{} } }
  return {narr,st};
}
function grantTitle(name,why){
  if(!TITLES.includes(name)&&!["随潮者","逆潮者","守岸人"].includes(name)) return;
  if(S.titles.includes(name)) return;
  S.titles.push(name); S.titleWhy[name]=why||""; pushLog({kind:"title",name,why});
}
function addFact(text){ const s=String(text).slice(0,90); if(!S.facts.some(f=>f.text===s)) S.facts.push({t:S.t,text:s}); }
function passTime(mins){
  const from=S.t; let m=Math.max(0,mins|0);
  if(S.voyage){
    if(m>0) m=Math.max(m,60);
    m=Math.min(m,S.voyage.left); S.voyage.left-=m;
    S.water=Math.max(0,S.water-m/DAY); S.food=Math.max(0,S.food-m/DAY);
    if(S.water<=0||S.food<=0) S.morale=clamp(S.morale-8,0,100);
  }
  S.t+=m;
  const here=S.voyage?"海上":S.loc;
  for(const e of worldTick(from,S.t)){
    if(e.where==="*"||e.where===here){ S.news.push(e.text); addFact(e.text); }
    else if(e.where==="盐风港") S.pending.push(e.text);
  }
  if(S.voyage&&S.voyage.left<=0){ S.loc=S.voyage.to; S.justArrived=S.voyage.to; S.voyage=null; S.spot="靠岸"; S.present=["莉娅"]; }
}

// split a long block into pages at sentence ends, ~120 chars per page
function paginate(paras){
  const pages=[]; let cur=[],len=0;
  for(const p of paras){
    const sents=p.match(/[^。！？!?]+[。！？!?」”]*|.+$/g)||[p];
    let buf="";
    for(const s of sents){
      if(len+buf.length+s.length>120&&(buf||cur.length)){ if(buf){cur.push(buf);buf="";} pages.push(cur); cur=[]; len=0; }
      buf+=s;
    }
    if(buf){ cur.push(buf); len+=buf.length; }
  }
  if(cur.length) pages.push(cur);
  return pages.length?pages:[[""]];
}
function cardHTML(id,paras){

function dmBlocks(text){

/* ---- route geometry: smooth a waypoint path and move along it ---- */
let KF=0;
// Hermite-smoothed dense samples {p,m,d}; m = segment mode ("l" foot / "s" boat), d = distance so far; ax = map width/height
function curve(pts,modes,ax){
  const P=[pts[0],...pts,pts[pts.length-1]], out=[{p:pts[0],m:(modes||[])[0]||"l"}], tau=.32;
  for(let i=1;i<P.length-2;i++){ const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2], m=(modes||[])[i-1]||"l";
    const n=Math.max(2,Math.ceil(Math.hypot((p2[0]-p1[0])*ax,p2[1]-p1[1])/1.2));
    for(let k=1;k<=n;k++){ const t=k/n,t2=t*t,t3=t2*t,h00=2*t3-3*t2+1,h10=t3-2*t2+t,h01=-2*t3+3*t2,h11=t3-t2;
      out.push({p:[0,1].map(j=>h00*p1[j]+h10*tau*(p2[j]-p0[j])+h01*p2[j]+h11*tau*(p3[j]-p1[j])),m}); } }
  let L=0; out.forEach((o,k)=>{ if(k) L+=Math.hypot((o.p[0]-out[k-1].p[0])*ax,o.p[1]-out[k-1].p[1]); o.d=L; });
  return out;
}
function along(c,k){ const T=c[c.length-1].d*k; for(let i=1;i<c.length;i++) if(c[i].d>=T){ const a=c[i-1],b=c[i],f=(T-a.d)/((b.d-a.d)||1); return [a.p[0]+(b.p[0]-a.p[0])*f,a.p[1]+(b.p[1]-a.p[1])*f]; } return c[c.length-1].p; }
function cut(c,k0,k1){ const T=c[c.length-1].d, a=T*k0, b=T*k1, out=[{p:along(c,k0),m:c[0].m,d:a}]; for(const o of c) if(o.d>a&&o.d<b) out.push(o); out.push({p:along(c,k1),m:c[c.length-1].m,d:b}); return out.map(o=>({...o,d:o.d-a})); }
const pct=v=>v.toFixed(2)+"%";
// trail drawn as runs of one mode: gold dots on foot, pale wake by boat
function trailSVG(c){ let h="", run=[];
  const flush=m=>{ if(run.length>1){ const pts=run.map(o=>o.p[0].toFixed(2)+","+o.p[1].toFixed(2)).join(" "); h+=`<polyline class="u" points="${pts}"/><polyline class="c${m==="s"?" sea":""}" points="${pts}"/>`; } };
  c.forEach((o,k)=>{ if(k&&o.m!==c[k-1].m){ flush(c[k-1].m); run=[c[k-1]]; } run.push(o); }); flush(c[c.length-1].m);
  return `<svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none">${h}</svg>`; }
// keyframes that move left/top through the samples between a% and b% of the animation
function kfMove(name,c,a,b){ const T=c[c.length-1].d||1, st=Math.max(1,Math.ceil(c.length/48)); let s=`@keyframes ${name}{0%,${a}%{left:${pct(c[0].p[0])};top:${pct(c[0].p[1])}}`;
  for(let i=st;i<c.length-1;i+=st) s+=`${(a+(b-a)*c[i].d/T).toFixed(2)}%{left:${pct(c[i].p[0])};top:${pct(c[i].p[1])}}`;
  const e=c[c.length-1].p; return s+`${b}%,100%{left:${pct(e[0])};top:${pct(e[1])}}}`; }
// camera zooms in on the start, then follows the walker
function kfCam(name,c,a,b,zEnd){ const T=c[c.length-1].d||1, st=Math.max(1,Math.ceil(c.length/24)); let s=`@keyframes ${name}{0%{transform:scale(1)}${a}%{transform:${camT(1.7,c[0].p)}}`;
  for(let i=st;i<c.length-1;i+=st) s+=`${(a+(b-a)*c[i].d/T).toFixed(2)}%{transform:${camT(1.7,c[i].p)}}`;
  return s+`${b}%,100%{transform:${camT(zEnd,c[c.length-1].p)}}}`; }
const voyK=v=>Math.max(0,Math.min(1,1-v.left/(hoursBetween(v.from,v.to)*60)));
const seaCurve=(a,b)=>curve(seaRoute(a,b),null,1448/1086);
// voyage routes: {poly,k0,k1}; older saves stored [p0,p1,[A,B]] as a straight line between two areas, redrawn here on the sea lane
function normRoute(r){ if(!r) return null; if(!Array.isArray(r)) return r; const [p0,p1,ln=[p0,p1]]=r;
  const L=Math.hypot(ln[1][0]-ln[0][0],ln[1][1]-ln[0][1])||1, pr=p=>{ const k=((p[0]-ln[0][0])*(ln[1][0]-ln[0][0])+(p[1]-ln[0][1])*(ln[1][1]-ln[0][1]))/(L*L); return Math.max(0,Math.min(1,k)); };
  const id=p=>AREAS.find(a=>Math.hypot(a.pos[0]-p[0],a.pos[1]-p[1])<1)?.id, fa=id(ln[0]), ta=id(ln[1]);
  return {poly:fa&&ta?seaRoute(fa,ta):ln,k0:pr(p0),k1:pr(p1)}; }
const sceneCurve=sc=>{ const pa=sc.path||{pts:[sc.a,sc.b],modes:["l"]}; return curve(pa.pts,pa.modes,1.5); };
/* ---- local scene maps ---- */
const NPC_OFF=[[-7,-5],[7,-5],[-8,5],[8,5],[0,-10],[0,9]];

function camT(z,p){ const m=(1-1/z)*50, cl=v=>Math.max(-m,Math.min(m,v)); return `scale(${z}) translate(${cl(50-p[0]).toFixed(2)}%,${cl(50-p[1]).toFixed(2)}%)`; }

function mapPins(big,route,anim){
  let h="";
  for(const a of AREAS) h+=`<span class="pin" style="left:${a.pos[0]}%;top:${a.pos[1]}%"${big?` data-open="area:${a.id}"`:""}><i></i>${big?`<span>${a.id}</span>`:""}</span>`;
  const r=normRoute(route);
  if(r){
    const c=curve(r.poly,null,1448/1086), e=c[c.length-1].p, seg=cut(c,r.k0,r.k1), p1=seg[seg.length-1].p;
    h+=trailSVG(c)+`<span class="pin dest" style="left:${e[0]}%;top:${e[1]}%"></span>`;
    if(anim){ const n="sl"+(++KF); h+=`<style>${kfMove(n,seg,0,100)}</style><span class="pin you" style="left:${pct(seg[0].p[0])};top:${pct(seg[0].p[1])};animation:${n} 2.6s linear both"><i></i></span>`; }
    else h+=`<span class="pin you" style="left:${p1[0]}%;top:${p1[1]}%"><i></i></span>`;
  } else if(S){ const p=shipPos(S.loc,S.voyage); h+=`<span class="pin you" style="left:${p[0]}%;top:${p[1]}%"><i></i></span>`; }
  return h;
}

async function moreIdeas(){
  if(V.ideasBusy||!S) return;
  if(!sample){ $("noAI").hidden=false; return; }
  V.ideasBusy=true; V.ideasErr=null; renderPop();
  const recent=S.log.slice(-8).map(e=>e.kind==="you"?"玩家："+e.text:e.kind==="dm"?"主持："+String(e.text).replace(/^@([^|｜]+)[|｜][^|｜]*[|｜]/gm,"$1：").slice(0,400):"").filter(Boolean).join("\n");
  const prompt=`你在帮《黑珍珠海域》的玩家想下一步。只根据玩家已经知道的事，不剧透隐藏真相。
玩家：${S.name}，在${S.voyage?`海上（前往${S.voyage.to}）`:`${S.loc}${S.spot?" · "+S.spot:""}`}，${fmtTime(S.t)}。金币 ${S.gold}，淡水 ${S.water.toFixed(1)} 天，口粮 ${S.food.toFixed(1)} 天。在场：${(S.present||[]).join("、")||"无"}。个人目标：${S.goal||"未定"}。
最近发生的事：
${recent}
上一批建议（不要重复）：${(S.suggestions||[]).join("；")}
给出恰好三个各不相同、此刻就能做的具体行动，每个不超过20字，用第一人称动作描述，按顺序：①推进眼前的线索或人物 ②稳妥、日常或船上生活 ③大胆或冒险的选择。
只输出 JSON 数组，例如 ["……","……","……"]。`;
  try{
    const {text}=await sample(prompt,{cache:false,modelTier:"quick"});
    const m=String(text).match(/\[[\s\S]*\]/); const arr=m?JSON.parse(m[0]):null;
    if(!Array.isArray(arr)||arr.length<3) throw new Error("bad");
    S.suggestions=arr.slice(0,3).map(x=>String(x).slice(0,30)); save();
  }catch(e){ V.ideasErr=e?.code==="rate_limited"?"额度暂时用完了，稍后再试。":"潮汐没想出来，可以再点一次。"; }
  V.ideasBusy=false; if(V.pop==="ideas") renderPop();
}
