  {key:"locs",name:"地点",sub:[{key:"areas",name:"区域",files:()=>AREAS.map(a=>({id:"area:"+a.id,name:a.id,img:a.img}))},{key:"pois",name:"地标",files:()=>POIS.map(p=>({id:"poi:"+p.id,name:p.id,img:p.img||AREAS.find(a=>a.id===p.area).img}))}],files:()=>[{id:"doc:worldmap",name:"黑珍珠海域",img:MAP}]},
  {key:"items",name:"物品",files:()=>ITEMS.map(i=>({id:"item:"+i.id,name:i.id,img:i.img}))},
  {key:"factions",name:"势力",files:()=>FACTIONS.map(f=>({id:"faction:"+f.id,name:f.id,img:f.img}))},
  {key:"lore",name:"传说",files:()=>LORE.filter(l=>!l.folder).map(l=>({id:"lore:"+l.id,name:l.id}))},
  {key:"quests",name:"委托",files:()=>SIDE_QUESTS.map(q=>({id:"quest:"+q.id,name:q.id,img:q.img}))},
  {key:"narrator",name:"叙述者",files:()=>[{id:"doc:storyline",name:"隐藏主线"},{id:"lore:潮汐式主线",name:"设计说明：潮汐式主线"}]},
  {key:"calendar",name:"日历",files:()=>[{id:"doc:tides",name:"大潮日历"}]},
  {key:"trackers",name:"追踪器",files:()=>[{id:"doc:trackers",name:"追踪器模板"}]},
  {key:"achv",name:"成就",files:()=>[{id:"doc:titles",name:"称号表"}]},
  {key:"cards",name:"规则卡",files:()=>[{id:"doc:actioncard",name:"行动卡"}]},
  {key:"memory",name:"记忆",files:()=>S?[{id:"doc:log",name:"航海日志"}]:[]},
];
const allFolders=()=>FOLDERS.flatMap(f=>[f,...(f.sub||[])]);
const folderByKey=k=>allFolders().find(f=>f.key===k);
const countIn=f=>f.files().length+(f.sub||[]).reduce((s,x)=>s+x.files().length,0);
const allFiles=()=>allFolders().flatMap(f=>f.files());
const fileName=id=>{ const f=allFiles().find(x=>x.id===id); if(f) return f.name; return id.split(":").slice(1).join(":"); };
function fileData(id){
  const [t,...r]=id.split(":"); const k=r.join(":");
  if(t==="npc") return {...npc(k),secret:SECRETS[k]||null};
  if(t==="area") return {...AREAS.find(a=>a.id===k),secret:SECRETS[k]||null};
  if(t==="poi") return {...POIS.find(p=>p.id===k),secret:SECRETS[k]||null};
  if(t==="item") return {...ITEMS.find(i=>i.id===k),secret:SECRETS[k]||null};
  if(t==="faction") return FACTIONS.find(f=>f.id===k);
  if(t==="quest") return SIDE_QUESTS.find(q=>q.id===k);
  if(t==="lore") return LORE.find(l=>l.id===k);
  if(t==="pc") return S?{name:S.name,origin:S.origin,goal:S.goal,profile:S.profile,mods:S.mods,gold:S.gold,hull:S.hull,morale:S.morale,items:S.items,titles:S.titles}:{};
  return {id,type:"document"};
}
const secretBox=s=>s?`<div class="secretbox"><b>只有作者和主持人知道</b>${esc(s)}</div>`:"";
function renderFile(id){
  const [t,...r]=id.split(":"); const k=r.join(":");
  if(V.fview==="json") return `<pre class="code">${esc(JSON.stringify(fileData(id),null,2))}</pre>`;
  if(t==="npc"){ const n=npc(k); const rel=S?S.rel[k]:0; const seen=S?S.seen.includes(k):false;
    const qs=SIDE_QUESTS.filter(q=>q.giver===k);
    return `<div class="narrow"><div class="dossier"><div class="por" style="${n.img?`background-image:url(${n.img})`:""}">${n.img?"":esc(k[0])}</div><div class="id"><small>黑珍珠海域 // 人物档案</small><h2>${esc(k)}</h2>
      <div class="vbar"><span>关系</span>${bar(rel+50,100,rel<0?"var(--red)":"var(--green)")}<span>${rel>0?"+":""}${rel}</span></div></div></div>
      <div class="sgrid"><div><small>身份</small><b style="font-size:13px">${esc(n.role.split(" · ")[0])}</b></div><div><small>常在</small><b style="font-size:13px">${esc(n.area)}</b></div><div><small>委托</small><b>${qs.length}</b></div><div><small>见过</small><b>${seen?"是":"否"}</b></div><div><small>关系</small><b>${rel>0?"+":""}${rel}</b></div><div><small>立绘</small><b>${n.img?"有":"缺"}</b></div></div>
      <div class="pcard"><h4>概览</h4><p class="prose">${linkify(esc(n.desc))}</p><dl class="kv" style="margin-top:10px"><dt>想要</dt><dd>${esc(n.want)}</dd><dt>知道</dt><dd>${esc(n.know)}</dd></dl>${secretBox(SECRETS[k])}</div>
      ${qs.length?`<div class="pcard"><h4>委托</h4>${qs.map(q=>`<button class="li" data-open="quest:${q.id}">${ico("file")}<span class="tx">${q.id}<small>${esc(q.desc)}</small></span></button>`).join("")}</div>`:""}</div>`; }
  if(t==="pc") return S?`<div class="narrow">${playerDossier()}</div>`:`<div class="fempty"><div><div class="ic">${ico("person")}</div>还没有可扮演角色。开始一段航程后会出现在这里。</div></div>`;
  if(t==="area"||t==="poi"){ const a=t==="area"?AREAS.find(x=>x.id===k):POIS.find(x=>x.id===k); const area=t==="area"?a:AREAS.find(x=>x.id===a.area);
    return `<div class="narrow"><div class="locard"><div class="im" style="background-image:url(${a.img||area.img})"></div><div class="bd"><p style="font-size:10.5px;letter-spacing:.2em;color:var(--mute)">${t==="area"?"区域":"地标 · "+esc(a.area)}</p><h2>${esc(k)}</h2><div>${(a.tags||[]).map(x=>`<span class="badge2">${x}</span>`).join("")}</div><p class="prose" style="margin-top:10px">${linkify(esc(a.desc))}</p>${a.detail?`<p class="prose" style="margin-top:8px">${linkify(esc(a.detail))}</p>`:""}${secretBox(SECRETS[k])}</div></div>
      ${t==="area"?`<div class="pcard" style="margin-top:10px"><h4>航程</h4>${LOCS.filter(l=>l!==k).map(l=>`<div class="li"><span class="tx">${l}</span><span class="v">${hoursBetween(k,l)} 小时</span></div>`).join("")}</div><div class="pcard"><h4>地标</h4>${POIS.filter(p=>p.area===k).map(p=>`<button class="li" data-open="poi:${p.id}">${ico("file")}<span class="tx">${p.id}<small>${esc(p.desc)}</small></span></button>`).join("")||`<p class="empty">暂无</p>`}</div>`:""}</div>`; }
  if(t==="item"){ const it=ITEMS.find(x=>x.id===k); return `<div class="narrow">${it.img?`<div class="locard" style="margin-bottom:10px"><div class="im" style="background-image:url(${it.img});height:300px;background-size:contain;background-repeat:no-repeat;background-color:#d9d0bd"></div></div>`:""}<div class="pcard"><p style="font-size:10.5px;letter-spacing:.2em;color:var(--mute)">物品</p><h2 style="font-family:var(--f-story);font-size:22px;margin:4px 0 6px">${esc(k)}</h2>${it.tags.map(x=>`<span class="badge2">${x}</span>`).join("")}${it.public?`<span class="badge2 ok">玩家可见</span>`:`<span class="badge2">拿到后才在百科出现</span>`}<p class="prose" style="margin-top:10px">${esc(it.desc)}</p>${secretBox(SECRETS[k])}</div></div>`; }
  if(t==="faction"){ const f=FACTIONS.find(x=>x.id===k); return `<div class="narrow">${f.img?`<div class="locard" style="margin-bottom:10px"><div class="im" style="background-image:url(${f.img});height:300px;background-size:contain;background-repeat:no-repeat;background-color:#d9d0bd"></div></div>`:""}<div class="pcard"><p style="font-size:10.5px;letter-spacing:.2em;color:var(--mute)">势力</p><h2 style="font-family:var(--f-story);font-size:22px;margin:4px 0 6px">${esc(k)}</h2>${f.tags.map(x=>`<span class="badge2">${x}</span>`).join("")}<p class="prose" style="margin-top:10px">${linkify(esc(f.desc))}</p></div></div>`; }
  if(t==="quest"){ const q=SIDE_QUESTS.find(x=>x.id===k); const st=S?({active:"进行中",done:"已完成",failed:"已错过"}[S.quests[k]]||"可接"):"可接"; return `<div class="narrow">${q.img?`<div class="locard" style="margin-bottom:10px"><div class="im" style="background-image:url(${q.img});height:260px"></div></div>`:""}<div class="pcard"><p style="font-size:10.5px;letter-spacing:.2em;color:var(--mute)">委托</p><h2 style="font-family:var(--f-story);font-size:22px;margin:4px 0 6px">${esc(k)}</h2><span class="badge2 ${st==="进行中"?"go":st==="已完成"?"done":"ok"}">${st}</span>${q.tags.map(x=>`<span class="badge2">${x}</span>`).join("")}<p class="prose" style="margin-top:10px">${linkify(esc(q.desc))}</p><dl class="kv" style="margin-top:12px"><dt>委托人</dt><dd><a class="ent" data-open="npc:${q.giver}">${q.giver}</a></dd><dt>起始地点</dt><dd>${linkify(esc(q.start))}</dd></dl></div></div>`; }
  if(t==="lore"){ const l=LORE.find(x=>x.id===k); return `<div class="narrow prose">${l.html}</div>`; }
  if(t==="doc") return `<div class="narrow">${docBody(k)}</div>`;
  return "";
}
function docBody(k){
  if(k==="storyline") return `<div class="pcard"><p style="font-size:10.5px;letter-spacing:.2em;color:#f0a196">只有作者和主持人知道</p><h2 style="font-family:var(--f-story);font-size:22px;margin:4px 0 10px">隐藏主线</h2><div class="prose">
    <p>主线不是玩家的任务，而是世界自己的日程。玩家看不到下面任何一条，只会在世界里撞见它们的后果。</p>
    <h3>五个阶段</h3><ul><li><b>开端</b>：接手燕鸥号，听说黑珍珠的传闻。</li><li><b>线索</b>：首次出海或第 2 天正午后。三片海图分别在贝恩、托比、圣玛格丽特号。</li><li><b>大潮</b>：玛拉起锚时。第 4 天 12:00–18:00 遗迹露出水面。</li><li><b>珍珠现世</b>：珍珠离开遗迹时。</li><li><b>余波</b>：珍珠落定，发放结局称号，可以带走一件物品。</li></ul>
    <h3>珍珠的默认旅程</h3><p>遗迹 → 玛拉（第 4 天 16:00）→ 回港（+18 小时）→ 伊莎挂牌（+41 小时，底价 600）→ 拍卖落槌，维尔以 1100 金买下（+100 小时）。玩家可以在任何一点介入：抢先、同行、资助、拖延、购买、交换、偷，或把它送人。</p>
    <h3>三种玩家的结局称号</h3><p>顺流者 → 随潮者；逆流者 → 逆潮者；守岸者 → 守岸人。</p></div></div>`;
  if(k==="tides") return `<div class="pcard"><h2 style="font-family:var(--f-story);font-size:22px;margin-bottom:10px">大潮日历</h2><div class="li"><span class="tx">第一次大潮<small>无灯岛潮汐遗迹露出水面</small></span><span class="v">第 4 天 12:00–18:00</span></div><div class="li"><span class="tx">第二次大潮<small>同上</small></span><span class="v">第 7 天 12:00–18:00</span></div>${secretBox("玩家不知道具体时间，只能从码头的议论和海水的变化里察觉。")}</div>`;
  if(k==="trackers") return `<div class="pcard"><h2 style="font-family:var(--f-story);font-size:22px;margin-bottom:10px">追踪器模板</h2>${TRACKER_TPL.map(x=>`<div class="li">${ico("layers")}<span class="tx">${x.t}<small>${x.d}</small></span></div>`).join("")}</div>`;
  if(k==="titles") return `<div class="pcard"><h2 style="font-family:var(--f-story);font-size:22px;margin-bottom:10px">称号表</h2>${[...TITLES,"随潮者","逆潮者","守岸人"].map(t=>`<div class="li"><span class="tx">${t}</span>${S&&S.titles.includes(t)?`<span class="badge2 done">已获得</span>`:""}</div>`).join("")}</div>`;
  if(k==="actioncard") return actionCard();
  if(k==="log") return S?`<div class="pcard"><h2 style="font-family:var(--f-story);font-size:22px;margin-bottom:10px">航海日志</h2>${S.facts.slice().reverse().map(f=>`<div class="memo ${f.text.startsWith("传闻")?"rumor":""}"><small>${fmtTime(f.t)}</small>${linkify(esc(f.text))}</div>`).join("")}</div>`:"";
  if(k==="worldmap") return `<div class="mapbig"><img src="${MAP}" alt="">${mapPins(true)}</div>`;
  return "";
}

/* ================= WORKSPACE: PLACES ================= */
function treeHTML(){
  const q=(V.treeQ||"").trim();
  const fileNodes=(f,depth)=>f.files().filter(x=>!q||x.name.includes(q)).map(x=>`<button class="node leaf" style="padding-left:${18+depth*14}px" data-open="${esc(x.id)}" aria-current="${V.active===x.id}">${ico(x.id.startsWith("npc")||x.id.startsWith("pc")?"person":"file","color:var(--folder)")}<span class="nm">${esc(x.name)}</span></button>`).join("");
  return FOLDERS.map(f=>{ const open=V.open.has(f.key)||!!q;
    return `<button class="node" data-fold="${f.key}" aria-current="${V.active==="d:"+f.key}"><span class="car ${open?"open":""}">▶</span><span class="fi">${ico("folder")}</span><span class="nm">${f.name}</span><span class="ct">${countIn(f)}</span></button>`
      +(open?(f.sub||[]).map(s=>{ const so=V.open.has(s.key)||!!q; return `<button class="node sub" data-fold="${s.key}" aria-current="${V.active==="d:"+s.key}"><span class="car ${so?"open":""}">▶</span><span class="fi">${ico("folder")}</span><span class="nm">${s.name}</span><span class="ct">${s.files().length}</span></button>`+(so?fileNodes(s,2):""); }).join("")+(f.key==="chars"&&!q?`<div class="tsearch">${ico("search","width:12px")}<input id="treeQ" placeholder="在人物中搜索" value=""></div>`:"")+fileNodes(f,1):"");
  }).join("");
}
function folderView(key){
  const f=folderByKey(key); const subs=f.sub||[]; const files=f.files(); const q=(V.folderQ||"").trim();
  const fl=files.filter(x=>!q||x.name.includes(q));
  return `<div class="fhead"><h2>${f.name}</h2><p>${files.length} 个文件${subs.length?`，${subs.length} 个文件夹`:""}</p></div>
  <div class="frow"><div class="fsearch">${ico("search","width:13px")}<input id="folderQ" placeholder="搜索文件……" value="${esc(V.folderQ||"")}"></div><button class="btn" disabled>${ico("plus","width:13px")}新建文件</button></div>
  <div class="tiles">${subs.map(s=>`<button class="tile" data-fold-open="${s.key}"><svg class="i fi"><use href="#i-folder"/></svg><span class="nm">${s.name}</span></button>`).join("")}${fl.map(x=>x.img?`<button class="tile img" data-open="${esc(x.id)}"><img src="${x.img}" alt=""><span class="nm">${esc(x.name)}</span></button>`:`<button class="tile" data-open="${esc(x.id)}"><svg class="i fi" style="color:#a99ff8"><use href="#i-${x.id.startsWith("npc")?"person":"file"}"/></svg><span class="nm">${esc(x.name)}</span></button>`).join("")}${Array.from({length:Math.max(0,(5-(subs.length+fl.length)%5)%5)},()=>`<span class="tile ph"></span>`).join("")}</div>`;
}
function filesPlace(){
  const tabs=V.tabs.map(id=>{ const isDir=id.startsWith("d:"); const name=isDir?folderByKey(id.slice(2)).name:fileName(id); return `<div class="ftab" aria-selected="${V.active===id}"><button data-tab="${esc(id)}" style="display:flex;align-items:center;gap:6px">${ico(isDir?"folder":id.startsWith("npc")?"person":"file",`width:13px;color:${isDir?"var(--folder)":"#a99ff8"}`)}<span class="nm">${esc(name)}</span></button><button class="x" data-closetab="${esc(id)}" aria-label="关闭">${ico("x","width:11px")}</button></div>`; }).join("");
  let content="";
  if(!V.active) content=`<div class="fempty"><div><div class="ic">${ico("folder")}</div><b>没有打开的文件</b><p style="font-size:12px;margin-top:4px">从左侧选一个文件，或按 ⌘K 查找。</p></div></div>`;
  else if(V.active.startsWith("d:")) content=`<div class="fview">${folderView(V.active.slice(2))}</div>`;
  else content=`<div class="ftool"><b>${esc(fileName(V.active))}</b><button aria-pressed="${V.fview==="render"}" data-fv="render" title="预览" aria-label="预览">${ico("eye")}</button><button disabled title="编辑" aria-label="编辑">${ico("pen")}</button><button aria-pressed="${V.fview==="json"}" data-fv="json" title="数据" aria-label="查看数据">${ico("braces")}</button><span class="sp"></span><button disabled aria-label="删除">${ico("trash")}</button><button disabled aria-label="历史">${ico("clock")}</button></div><div class="fview">${renderFile(V.active)}</div>`;
  return `<div class="tree"><div class="tree-tools"><button aria-pressed="true" aria-label="文件夹视图">${ico("folder")}</button><button aria-label="文件视图" disabled>${ico("file")}</button><span class="sp"></span><button disabled aria-label="新建文件">${ico("plus")}</button><button disabled aria-label="新建文件夹">${ico("folder")}</button></div><div class="tree-body">${treeHTML()}</div></div><div class="files">${V.tabs.length?`<div class="ftabs">${tabs}</div>`:""}${content}</div>`;
}
function overviewPlace(){
  const types=[
    {key:"chars",name:"人物",n:NPCS.length,feat:NPCS[1],items:NPCS.slice(2,6),f:n=>"npc:"+n.id,img:n=>n.img},
    {key:"locs",name:"地点",n:AREAS.length+POIS.length,feat:AREAS[4],items:POIS.filter(p=>["咸鱼与月亮","奥伦船厂","圣玛格丽特号","托比的礁石"].includes(p.id)),f:a=>(a.area?"poi:":"area:")+a.id,img:a=>a.img},
    {key:"quests",name:"委托",n:SIDE_QUESTS.length,feat:SIDE_QUESTS[1],items:SIDE_QUESTS.slice(2,6),f:q=>"quest:"+q.id,img:q=>q.img},
    {key:"lore",name:"传说",n:LORE.length,feat:LORE[0],items:LORE.slice(1,4),f:l=>"lore:"+l.id,img:()=>null},
    {key:"factions",name:"势力",n:FACTIONS.length,feat:FACTIONS[0],items:FACTIONS.slice(1,5),f:x=>"faction:"+x.id,img:x=>x.img},
    {key:"items",name:"物品",n:ITEMS.length,feat:ITEMS[0],items:ITEMS.slice(3,7),f:x=>"item:"+x.id,img:x=>x.img},
  ];
  const entries=allFiles().length;
  return `<div class="ov">
    <div class="ov-hero" style="background-image:url(img/scene-lamp.jpg)"><span class="lite">黑珍珠 · 原型</span><svg viewBox="0 0 600 170" aria-label="The Black Pearl"><use href="#logo"/></svg></div>
    <div class="emblem"><i>⚓</i></div>
    <p class="ov-tag">一港四岛，一颗世上唯一的黑珍珠。驾驶一艘缺淡水的小帆船，在一个会自己运转的海港世界里，追它、帮别人追它、拦住别人，或者干脆不理它，好好过日子。</p>
    <div class="ov-sec"><div class="ov-split"><div><p class="ov-eyebrow">传说</p><p class="ov-big">海会退到不该退的地方。</p></div><div class="ov-prose">${LEGEND}</div></div></div>
    <div class="ov-sec"><p class="ov-eyebrow">掠影</p><div class="glimpses">${["scene-port","scene-sail","scene-cabin","scene-night","scene-gull","scene-reef"].map(s=>`<img src="img/${s}.jpg" alt="">`).join("")}</div></div>
    <div class="ov-sec"><p class="ov-eyebrow">作者的话</p><p class="ov-note">这是一个用来验证“隐藏主线 + 弱指引”的原型。主线只写在世界的日程里，玩家在游戏中看不到它，只会撞见它的后果。</p></div>

function worldDigest(author){
  return `世界：黑珍珠海域。\n传说：${LEGEND.replace(/<[^>]+>/g,"")}\n区域：${AREAS.map(a=>a.id+"（"+a.desc+"）").join("；")}\n人物：${NPCS.map(n=>n.id+"（"+n.role+"）："+n.desc+(author&&SECRETS[n.id]?"【秘密】"+SECRETS[n.id]:"")).join("\n")}\n委托：${SIDE_QUESTS.map(q=>q.id+"："+q.desc).join("；")}\n规则：d20+能力对比难度 8/12/16/20；航程：${LOCS.slice(1).map(l=>"盐风港→"+l+" "+hoursBetween("盐风港",l)+"小时").join("，")}。`+(author?`\n隐藏主线与真相：${WORLD_BIBLE.split("【只有你知道的真相】")[1]||""}`:"");
}
async function ask(which,q){
  q=q.trim(); if(!q) return;
  const msgs=V.asst[which]; msgs.push({r:"u",t:q}); msgs.push({r:"a",t:"……"});
  const paint=()=>{ if(which==="ws") $("asstBody").innerHTML=asstHTML("ws"); else { const el=$("sideAsst"); if(el) el.innerHTML=asstHTML("play"); } const b=which==="ws"?$("asstBody"):$("side")?.querySelector(".side-body"); if(b) b.scrollTop=b.scrollHeight; };
  paint();
  if(!sample){ msgs[msgs.length-1].t="助手暂时连不上，请稍后再试。"; paint(); return; }
  const role=which==="ws"
    ?`你是《黑珍珠海域》的创作助手，帮作者理解和完善这个世界。你能看到全部资料，包括隐藏主线。回答简洁、具体，用中文。只提建议，不要假装已经修改了文件。`
    :`你是《黑珍珠海域》的游戏助手，回答玩家关于规则、地点和已知信息的问题。不要剧透隐藏的真相、海图位置或大潮时间；不知道的就说“在故事里打听看看”。回答简洁，用中文。`;
  const ctxFile=which==="ws"&&V.active&&!V.active.startsWith("d:")?`\n当前打开的文件：${fileName(V.active)}\n${JSON.stringify(fileData(V.active)).slice(0,1500)}`:"";
  const playCtx=which==="play"&&S?`\n玩家现在：${S.voyage?"海上":S.loc}，${fmtTime(S.t)}，金币 ${S.gold}，淡水 ${S.water.toFixed(1)} 天。`:"";
  const convo=msgs.slice(0,-1).slice(-8).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
  convo[0]={role:"user",content:role+"\n\n"+worldDigest(which==="ws")+ctxFile+playCtx+"\n\n"+convo[0].content};
  try{
    await sample(convo,{cache:false,modelTier:"quick",onText:({text})=>{ msgs[msgs.length-1].t=text; paint(); }});
  }catch(e){ msgs[msgs.length-1].t=e?.code==="rate_limited"?"额度暂时用完了，稍后再问。":"助手没能回答，可以再试一次。"; paint(); }
}

/* ================= TURN ================= */
function save(){ store(SAVE_KEY,S); }
function stateCopy(){ const o={...S}; delete o.log; delete o.hist; return JSON.parse(JSON.stringify(o)); }
const turnStart=i=>{ for(let k=Math.min(i,S.log.length-1);k>=0;k--) if(S.log[k].kind==="you") return k; return 0; };
const snapAt=k=>(S.hist||[]).find(h=>h.at===k);
function rewindTo(k){
  const h=snapAt(k); if(!h) return false;
  const log=S.log.slice(0,k), hist=S.hist.filter(x=>x.at<k);
  S=Object.assign(JSON.parse(JSON.stringify(h.s)),{log,hist});
  V.beat=0; V.turnReady=true; V.vnFrom=null; V.pages={};
  save(); renderLog(); renderHUD(); if(V.side) renderSide(); scrollEnd(); return true;
}
function toast(t){ const d=document.createElement("div"); d.className="toastmsg"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1600); }
function closeMsgMenu(){ document.getElementById("msgmenu")?.remove(); }
function msgMenu(btn,i){
  closeMsgMenu();
  const k=turnStart(i), en=S.log[i], lastYou=turnStart(S.log.length-1);
  const hasTurn=S.log[k]?.kind==="you", can=hasTurn&&!!snapAt(k)&&!busy;
  const m=document.createElement("div"); m.className="msgmenu"; m.id="msgmenu";
  m.innerHTML=`<button data-mm="copy|${i}">${ico("file")}复制</button>
    <button data-mm="vnfrom|${k}">${ico("play","width:13px;fill:currentColor;stroke:none")}从这里看剧情</button>
    <button data-mm="rewrite|${k}" ${can&&k===lastYou?"":"disabled"}>${ico("refresh")}重写这一回合</button>
    <hr><button class="danger" data-mm="rewind|${k}" ${can?"":"disabled"}>${ico("trash")}回到这一回合之前</button>
    ${hasTurn&&!snapAt(k)?`<small>这一回合太早了，没有存档可以回退。</small>`:""}`;
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect(), mw=210, mh=m.offsetHeight;

function msgAction(kind,i){
  closeMsgMenu();
  if(kind==="copy"){ const en=S.log[i]; const txt=String(en?.text||"").replace(/^@([^|｜]+)[|｜][^|｜]*[|｜]/gm,"$1："); try{ navigator.clipboard.writeText(txt).then(()=>toast("已复制"),()=>toast("复制失败")); }catch{ toast("复制失败"); } return; }
  if(kind==="vnfrom"){ V.view="vn"; V.vnFrom=S.log[i]?.kind==="you"?i:null; V.beat=0; V.turnReady=false; renderLog(); renderHUD(); return; }
  if(kind==="rewrite"){ const en=S.log[i]; if(!en||busy) return; const a=en.act||en.text, lb=en.act&&en.act!==en.text?en.text:undefined; if(rewindTo(i)) act(a,lb); return; }
  if(kind==="rewind"){
    $("modal").innerHTML=`<div class="palette" style="padding:18px"><h3 style="margin-bottom:6px">回到这一回合之前？</h3><p class="empty" style="margin-bottom:14px">这一回合和之后发生的事都会被抹掉，船、货物和关系回到当时的样子。称号收藏栏不受影响。</p><div style="display:flex;gap:8px"><button class="btn" data-mm="rewindyes|${i}">回退</button><button class="btn ghost" data-cmd="modalclose">取消</button></div></div>`;
    $("modal").hidden=false; return; }

function diffFx(b){
  const chips=[]; const num=(v,unit,name,dp)=>{ if(Math.abs(v)<(dp?0.5:1)) return; const r=Math.round(v*10)/10; const s=Number.isInteger(r)?r:r.toFixed(1); chips.push({c:v>0?"up":"down",t:`${name} ${v>0?"+":""}${s}${unit}`}); };
  num(S.gold-b.gold,"","金币"); num(S.water-b.water," 天","淡水",1); num(S.food-b.food," 天","口粮",1); num(S.hull-b.hull,"","船体"); num(S.morale-b.morale,"","士气");

async function act(action,label){
  action=action.trim(); if(!action||busy) return;
  if(!sample){ $("noAI").hidden=false; return; }
  busy=true; ctl=new AbortController(); V.pop=null; V.turnReady=false; V.vnFrom=null; V.waiting=label||action; renderPop();
  S.hist=(S.hist||[]).filter(h=>h.at<S.log.length).slice(-7); S.hist.push({at:S.log.length,s:stateCopy()});
  pushLog({kind:"you",text:label||action,act:action});
  const d20=1+Math.floor(Math.random()*20); S._d20=d20;
  const prompt=buildPrompt(action,d20);
  renderLog();
  let holder=null;
  if(V.view==="chat"){ holder=document.createElement("div"); holder.className="msg";
    holder.innerHTML=`<div class="chiprow">${speakerChip("潮汐")}</div><div class="card"><div class="txt"><p class="thinking">潮汐正在想……</p></div></div>`;
    $("log").appendChild(holder); }
  renderHUD(); scrollEnd();
  const before=snap();
  try{
    const {text}=await sample(prompt,{signal:ctl.signal,cache:false,effort:"low",onText:({text})=>{ const n=parseReply(text).narr; if(n&&holder&&V.view==="chat"){ holder.innerHTML=dmBlocks(n).map(b=>`<div class="chiprow">${speakerChip(b.who,b.tone)}</div><div class="card"><div class="txt">${b.paras.map(p=>`<p>${esc(p)}</p>`).join("")}</div></div>`).join(""); scrollEnd(); } }});
    holder?.remove();
    const {narr,st}=parseReply(text);
    S.justArrived=null; S.turn=(S.turn||0)+1;
    const notes=st?applyState(st):[];
    if(S.lastCheck){ const c=S.lastCheck, m=S.mods[c.ability]||0, tot=d20+m;
      pushLog({kind:"ask",text:`潮汐要求检定：${c.why||c.ability}`});
      pushLog({kind:"roll",label:`${c.ability}检定`,expr:`d20+${m}`,total:tot,dc:c.dc,ok:tot>=c.dc}); }
    pushLog({kind:"dm",text:narr||"海面上一片寂静。",turn:S.turn,fx:diffFx(before)});
    if(!st) pushLog({kind:"warn",text:"这回合的世界变化没能读出来，状态保持不变。可以换个说法再试。"});
    for(const n of notes) if(n.startsWith("世界校验")) pushLog({kind:"warn",text:n});
    if(S.voyage&&!before.voy) pushLog(arrivalEntry("启航"));
    else if(!S.voyage&&(before.voy||S.loc!==before.loc)){ S.visited=S.visited||[]; if(!S.visited.includes(S.loc)) S.visited.push(S.loc); pushLog(arrivalEntry("抵达")); }
    checkAct();
    V.beat=0; V.turnReady=V.view!=="vn";
  }catch(e){
    holder?.remove();
    const code=e?.code;
    if(code==="cancelled") pushLog({kind:"sys",text:"你收回了这一步，什么都没有发生。"});
    else if(["not_granted","sampling_disabled","not_declared"].includes(code)){ sample=null; $("noAI").hidden=false; S.log.pop(); }
    else if(code==="rate_limited") pushLog({kind:"warn",text:"Claude 的额度暂时用完了，稍后再继续航程。"});
    else if(code==="refused") pushLog({kind:"warn",text:"潮汐没法接这个行动，换一种做法试试。"});
    else pushLog({kind:"warn",text:"潮汐掉线了，什么都没有发生。可以再试一次。"});
    V.beat=0;
  }finally{
    busy=false; V.waiting=null; save(); renderLog(); renderHUD(); if(V.side) renderSide(); scrollEnd();
  }
}

// the latest turn, broken into beats that are shown one at a time
function buildBeats(){
  if(!S) return [];
  let start=0,end=S.log.length;
  if(V.vnFrom!=null){ start=V.vnFrom; for(let i=start+1;i<S.log.length;i++) if(S.log[i].kind==="you"){ end=i; break; } }
  else for(let i=S.log.length-1;i>=0;i--){ if(S.log[i].kind==="you"&&S.log[i+1]){ start=i; break; } }
  const seg=S.log.slice(start,end);
  const main=[],tail=[];
  for(let i=0;i<seg.length;i++){ const e=seg[i];
    if(e.kind==="begin") main.push({type:"arrival",label:"故事开始",place:e.place,when:"你的旅程从这里开始",img:AREAS.find(a=>a.id===e.place)?.img});
    else if(e.kind==="arrival") (e.label==="启航"?tail:main).push({type:"arrival",label:e.label,place:e.place,when:e.when,img:e.label==="启航"?"img/scene-sail.jpg":AREAS.find(a=>e.place.startsWith(a.id))?.img});
    else if(e.kind==="ask"){ const r=seg[i+1]?.kind==="roll"?seg[++i]:null; main.push({type:"check",ask:e.text,roll:r}); }
    else if(e.kind==="roll") main.push({type:"check",ask:"",roll:e});
    else if(e.kind==="oracle") paginate(e.paras).forEach(pg=>main.push({type:"say",who:"潮汐",tone:"",paras:pg}));
    else if(e.kind==="dm"){
      for(const b of dmBlocks(e.text)) paginate(b.paras).forEach(pg=>main.push({type:"say",who:b.who,tone:b.tone,paras:pg}));
      if(e.fx&&e.fx.scene) main.push({type:"scene",sc:e.fx.scene,i:S.log.indexOf(e)});
      if(e.fx&&(e.fx.chips.length||e.fx.move)) main.push({type:"fx",fx:e.fx});
    }
    else if(e.kind==="title") tail.push({type:"title",name:e.name,why:e.why});
    else if(e.kind==="chapter"&&e.line) tail.push({type:"say",who:"潮汐",tone:"",paras:[e.line+(e.sub?" "+e.sub:"")]});
    else if(e.kind==="sys"||e.kind==="warn") tail.push({type:"sys",text:e.text,warn:e.kind==="warn"});
  }
  // a departure beat goes right after the state-change beat
  return [...main,...tail];
}

    if((el=c("[data-ptab]"))){ V.pinTab=el.dataset.ptab; if(V.mode==="ws") renderWS(); else renderSide(); return; }
    if((el=c("[data-pop]"))){ V.pop=V.pop===el.dataset.pop?null:el.dataset.pop; renderPop(); return; }
    if((el=c("[data-fill]"))){ const i=$("input"); i.value=el.dataset.fill; V.pop=null; renderPop(); i.focus(); i.setSelectionRange(i.value.length,i.value.length); return; }
    if((el=c("[data-insert]"))){ const i=$("input"); i.value=(el.dataset.insert+i.value).trim(); V.pop=null; renderPop(); i.focus(); return; }
    if((el=c("[data-send]"))){ act(el.dataset.send); return; }
    if((el=c("[data-ask]"))){ const [w,q]=el.dataset.ask.split("|"); ask(w,q); return; }
    if((el=c("[data-pnav]"))){ V.prefNav=el.dataset.pnav; document.getElementById("p-"+V.prefNav)?.scrollIntoView({behavior:"smooth",block:"start"}); $("modal").querySelectorAll("[data-pnav]").forEach(b=>b.setAttribute("aria-selected",b.dataset.pnav===V.prefNav)); return; }
    if((el=c("[data-pref-tog]"))){ const k=el.dataset.prefTog; if(S){ S.prefs[k]=!S.prefs[k]; save(); el.setAttribute("aria-pressed",S.prefs[k]); } return; }
    if((el=c("[data-cmd]"))){ const k=el.dataset.cmd; V.menu=false;
      if(k==="workspace"){ $("modal").hidden=true; showMode("ws"); }
      else if(k==="play"||k==="exit-ws"){ $("modal").hidden=true; showMode("play"); }
      else if(k==="palette") palette();
      else if(k==="prefs") prefsModal();
      else if(k==="modalclose") $("modal").hidden=true;
      else if(k==="reset"){ if(!S){ renderHUD(); return; } $("modal").innerHTML=`<div class="palette" style="padding:18px"><h3 style="margin-bottom:6px">开始新的航程？</h3><p class="empty" style="margin-bottom:14px">当前进度会被清除，收藏栏不受影响。</p><div style="display:flex;gap:8px"><button class="btn" data-cmd="resetyes">重新开始</button><button class="btn ghost" data-cmd="modalclose">取消</button></div></div>`; $("modal").hidden=false; }
      else if(k==="resetyes"){ S=null; try{localStorage.removeItem(SAVE_KEY);}catch{} $("modal").hidden=true; V.side=null; showMode("play"); }
      else if(k==="exit"){ V.place="overview"; showMode("ws"); }
      else if(k==="begin") beginVoyage();
      else if(k==="next") beatGo((V.beat||0)+1);
      else if(k==="prev") beatGo((V.beat||0)-1);
      else if(k==="turn") toList();
      else if(k==="readback") toList();
      else if(k==="replay") replay();
      else if(k==="replaymove") renderVN();
      else if(k==="ideasmore") moreIdeas();
      else if(k==="screplay"||k==="arrreplay"){ const m=k==="screplay"?el.closest(".scard").querySelector(".m"):el.closest(".arrcard"); const z=m.querySelector(".z"); if(z){ z.style.transform=z.style.getPropertyValue("--tB"); delete V.mz[z.id.slice(2)]; } m.classList.remove("play"); void m.offsetWidth; m.classList.add("play"); }
      else if(k==="stop"){ ctl?.abort(); }
      else if(k==="sound"){ V.sound=!V.sound; }
      else if(k==="achclose"){ V.ach=false; }
      else if(k==="sideclose"){ V.side=null; renderSide(); }
      else if(k==="workspace-open"){ const id={sheet:"pc:me",pinned:"doc:actioncard",map:"doc:worldmap",trackers:"doc:trackers"}[V.side]; if(id) openFile(id); }
      else if(k==="roll"){ if(S){ const r=1+Math.floor(Math.random()*20); pushLog({kind:"roll",label:"掷骰",expr:"1d20",total:r}); V.pop=null; save(); renderLog(); renderPop(); scrollEnd(); } }
      else if(k==="collect") collect();
      else if(k==="profreset"){ if(S){ S.profile=defaultProfile(S.origin); save(); renderSide(); toast("已恢复默认设定"); } }
      else if(k==="newchat"){ V.asst.ws=[]; renderWS(); }
      renderHUD(); return; }
    if(c("#menuBtn")){ V.menu=!V.menu; V.ach=false; renderHUD(); return; }
    if(c("#achBtn")){ V.ach=!V.ach; V.menu=false; renderHUD(); return; }
    if(c("#minimap")){ V.side="map"; renderSide(); return; }
    if(t.id==="modal"){ $("modal").hidden=true; return; }
    if(V.menu&&!c("#menu")){ V.menu=false; renderHUD(); }
    if(V.pop&&!c("#pop")){ V.pop=null; renderPop(); }
  });
  $("form").onsubmit=e=>{ e.preventDefault(); const v=$("input").value.trim(); $("input").value=""; $("input").style.height=""; if(v) act(v); else act("（继续，看看接下来会发生什么）","继续故事"); };
  $("input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $("form").requestSubmit(); } });
  $("input").addEventListener("input",e=>{ const el=e.target; el.style.height="28px"; el.style.height=Math.min(140,el.scrollHeight)+"px"; });
  $("asstForm").onsubmit=e=>{ e.preventDefault(); const v=$("asstInput").value; $("asstInput").value=""; ask("ws",v); };
  $("asstToggle").onclick=()=>{ const ws=$("ws"); if(matchMedia("(max-width:1100px)").matches) ws.classList.toggle("showasst"); else ws.classList.toggle("noasst"); };
  document.addEventListener("submit",e=>{ if(e.target.id==="sideAsstForm"){ e.preventDefault(); const i=$("sideAsstInput"); const v=i.value; i.value=""; ask("play",v); } });
  document.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); palette(); return; }
    if(V.mode==="play"&&V.view==="vn"&&S&&!V.waiting&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")&&$("modal").hidden){
      const n=buildBeats().length;
      if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter"){ e.preventDefault(); beatGo(V.beat+1); return; }
      if(e.key==="ArrowLeft"){ e.preventDefault(); beatGo(V.beat-1); return; }
    }
    if(e.key==="Escape"){ closeMsgMenu(); $("modal").hidden=true; V.menu=false; V.ach=false; V.pop=null; if(V.mode==="play"){ renderHUD(); renderPop(); } }
  });
  window.claude?.hot?.snapshot?.(()=>({S}));
  showMode("play");
  (async()=>{ try{ sample=await window.claude?.use?.("sample")??null; }catch{ sample=null; } if(!sample&&S) $("noAI").hidden=false; if(V.mode==="play") renderHUD(); })();
}
function collect(){
  if(!S) return;
  $("modal").innerHTML=`<div class="palette" style="padding:16px"><h3 style="margin-bottom:6px">带走一件物品</h3><p class="empty" style="margin-bottom:12px">每个世界只能带走一件，选定后不能更换。世界里的原物还会留在原处。</p>${S.items.map((o,i)=>`<button class="li" data-pick="${i}">${ico("file")}<span class="tx">${esc(o)}</span></button>`).join("")}</div>`;
  $("modal").hidden=false;
  $("modal").querySelectorAll("[data-pick]").forEach(b=>b.onclick=async()=>{
    const item=S.items[+b.dataset.pick];
    const shelf=load(SHELF_KEY)||[]; shelf.push({item,card:{name:item,provenance:["来自黑珍珠海域的一段航程。"],inscription:"",grade:item==="黑珍珠"?"真品":"普通物品"},who:S.name,titles:S.titles.slice(),when:fmtTime(S.t),at:Date.now()}); store(SHELF_KEY,shelf);
    S.collected=true; pushLog({kind:"sys",text:`「${item}」已经放进你的收藏栏。`}); save(); $("modal").hidden=true; renderLog(); scrollEnd();
  });
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

})();
</script>
